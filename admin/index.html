<style>
/* 과정 도구 — 공통 CSS (peter-design-system 토큰 · Pretendard 단일)
   참가자 진단 · 리포트 · 코치 콘솔이 같이 쓴다. 우리 팀 처방전 report.css 의 토큰을 승계했다.
   막대는 색만으로 가르지 않는다 — 판정 글자 · 점수 숫자 · 60/75 기준선을 함께 둔다. */
:root{
  --ink:#122420; --ink-2:#1B382F; --ink-soft:#24332C; --gray:#5E6A64; --line:#E2EBE4; --paper:#F4F7F4; --card:#fff;
  --green:#1F9E43; --green-dk:#157A34; --lime:#7CB342; --teal:#2C8C86; --blue:#2E6E9E;
  --plate:#EAF2EC; --lv2:#DDF0E2; --lv3:#BCE3C6;
  --weak:#122420; --mid:#2C8C86; --strong:#1F9E43;
  --warn-bg:#FFF6E0; --warn-bd:#F0DFAE; --warn-fg:#6A5312; --err-bg:#FDECEC; --err-bd:#F2C4C4; --err-fg:#8A1F1F;
  --r-sm:12px; --r-md:18px; --r-lg:26px; --pill:50px;
  --shadow-sm:0 2px 10px rgba(18,36,32,.06); --shadow-md:0 8px 30px rgba(18,36,32,.09); --shadow-lg:0 18px 50px rgba(18,36,32,.14);
  --grad:linear-gradient(120deg,#1F9E43,#2C8C86,#2E6E9E);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink-soft);background:var(--paper);line-height:1.65;font-size:16px;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{color:var(--ink);margin:0;line-height:1.3;letter-spacing:-.02em}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 단추 — 알약형 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.7rem 1.3rem;border-radius:var(--pill);
  border:1px solid transparent;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;line-height:1.3;background:none;
  transition:transform .18s var(--ease),background .18s,border-color .18s,box-shadow .18s,color .18s}
.btn-primary{background:var(--green-dk);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,158,67,.28)}
.btn-line{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-line:hover{border-color:var(--green);color:var(--green-dk);transform:translateY(-2px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-kakao{background:#FEE500;color:#191919}
.btn-danger{background:var(--card);color:var(--err-fg);border-color:var(--err-bd)}
.btn-sm{min-height:40px;padding:.35rem .95rem;font-size:14px}
.btn-xs{min-height:34px;padding:.2rem .7rem;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn .arrow{transition:transform .2s var(--ease)}
.btn:hover .arrow{transform:translateX(3px)}
.eyebrow{display:inline-flex;align-items:center;gap:.45rem;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-dk)}
.eyebrow .mark{width:15px;height:15px;background:var(--mark) center/contain no-repeat;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;
  background:var(--ink);color:#fff;border-radius:var(--pill);padding:.7rem 1.2rem;font-size:14.5px;font-weight:600;box-shadow:var(--shadow-lg);
  transition:opacity .25s,transform .25s var(--ease);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-fg);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;line-height:1.6}
.errbox{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-fg);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;line-height:1.6}

/* ── 리포트 ─────────────────────────────────────────── */
.rp{max-width:760px;margin:0 auto;padding:0 18px 48px}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.rp-logo{display:block;width:112px;height:52px;background:var(--logo) left center/contain no-repeat;flex:0 0 auto}
.rp-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.rp-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.rp-head{padding:20px 0 6px}
.rp-meta{font-size:13.5px;color:var(--gray);font-weight:600;margin:0 0 10px}
.rp-head h1{font-size:clamp(24px,6.4vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.32}
.rp-head h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rp-note{font-size:14px;color:var(--gray);margin-top:10px}
.rp-sec{margin-top:34px}
.rp-sh{margin:0 0 14px}
.rp-sh .eyebrow{margin-bottom:6px}
.rp-sh h2{font-size:clamp(21px,5.4vw,26px);font-weight:800;letter-spacing:-.03em}
.rp-sh p{font-size:14.5px;color:var(--gray);margin-top:6px;line-height:1.6}
.rp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:20px}
.rp-card + .rp-card{margin-top:12px}
.rp-callout{background:var(--plate);border-radius:var(--r-sm);padding:14px 16px;font-size:15px;line-height:1.65;color:var(--ink-soft)}
.rp-callout b{color:var(--ink)}
.rp-quote{font-size:15px;color:var(--ink);font-weight:600;border-left:3px solid var(--green);padding:2px 0 2px 12px;margin:0 0 10px}

/* ① 한눈에 — 다크 카드(결과 카드와 같은 구성) */
.rp-glance{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:24px 22px 22px;color:#fff;
  background:linear-gradient(150deg,var(--ink),var(--ink-2));box-shadow:var(--shadow-md)}
.rp-glance::before{content:"";position:absolute;width:360px;height:360px;top:-170px;right:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,158,67,.45),transparent 65%);pointer-events:none}
.rp-glance::after{content:"";position:absolute;width:300px;height:300px;bottom:-170px;left:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,110,158,.35),transparent 65%);pointer-events:none}
.rp-glance > *{position:relative}
.rp-g-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.rp-g-stage{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.rp-g-stage small{display:block;font-size:15px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.78);margin-top:8px}
.rp-steps{display:flex;align-items:flex-end;gap:5px;height:52px}
.rp-steps span{width:18px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.18)}
.rp-steps span.on{background:#8FD9A2}
.rp-g-label{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9FE0B0;margin:20px 0 8px}
.rp-g-bars{display:grid;gap:8px}
.rp-g-bar{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:10px;font-size:14px;font-weight:700}
.rp-g-bar .tr{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.rp-g-bar .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4CC46C,#8FD9A2)}
.rp-g-bar b{text-align:right}
.rp-g-chips{display:flex;flex-wrap:wrap;gap:8px}
.rp-g-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:var(--pill);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);font-size:14.5px;font-weight:700;backdrop-filter:blur(6px)}
.rp-g-chip em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.rp-g-chip.str{background:rgba(124,179,66,.18);border-color:rgba(159,224,176,.45)}

/* ② 숙지 사다리 */
.rp-ladder svg{display:block;width:100%;height:auto;max-height:170px}
.rp-ladder .st{fill:var(--lv2)}
.rp-ladder .st.on{fill:var(--green)}
.rp-ladder .st.past{fill:var(--lv3)}
.rp-ladder text{font-family:var(--font);font-weight:800;font-size:22px;fill:var(--ink)}
.rp-ladder text.on{fill:#fff}
.rp-ladder .mk{fill:var(--ink)}
.rp-stlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.rp-stlist li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card)}
.rp-stlist li .n{width:30px;height:30px;border-radius:9px;background:var(--paper);color:var(--gray);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rp-stlist li b{display:block;color:var(--ink);font-size:15px}
.rp-stlist li span{display:block;font-size:14px;color:var(--gray);line-height:1.55;margin-top:2px}
.rp-stlist li.on{border-color:var(--green);background:var(--plate);box-shadow:0 0 0 2px rgba(31,158,67,.15)}
.rp-stlist li.on .n{background:var(--green-dk);color:#fff}
.rp-stlist .next{grid-column:1 / -1;margin-top:6px;padding:11px 13px;border-radius:10px;background:var(--card);border:1px dashed var(--green);font-size:14.5px;color:var(--ink-soft);line-height:1.6}

/* ③ 세 층 · ⑦ 전체 막대 */
.rp-bars{display:grid;gap:12px}
.rp-bar{display:grid;grid-template-columns:minmax(78px,30%) 1fr 64px;align-items:center;gap:10px}
.rp-bar .lb{font-weight:700;color:var(--ink);font-size:15px;line-height:1.35}
.rp-bar .lb small{display:block;font-weight:500;color:var(--gray);font-size:12.5px;letter-spacing:.02em}
.rp-bar .sc{text-align:right;font-weight:800;color:var(--ink);font-size:15px;white-space:nowrap}
.rp-bar .sc small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gray)}
.rp-track{position:relative;height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
.rp-track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--green)}
.rp-track i.weak{background:var(--weak)}
.rp-track i.mid{background:var(--mid)}
.rp-track i.strong{background:var(--strong)}
.rp-track .ln{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed rgba(18,36,32,.45)}
.rp-track .ln.s{border-left-style:solid;border-left-color:rgba(18,36,32,.6)}
.rp-track .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;border:2px solid var(--ink);opacity:.85}
.rp-bar .ds{grid-column:1 / -1;font-size:13px;color:var(--gray);margin:0;line-height:1.5}
.rp-stack .rp-bar{padding:12px 14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.rp-stack .rp-bar.low{border-color:var(--ink);box-shadow:0 0 0 2px rgba(18,36,32,.12)}
.rp-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--gray);margin:0 0 12px}
.rp-legend span{display:inline-flex;align-items:center;gap:6px}
.rp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rp-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.rp-pill.weak{background:var(--weak);color:#fff}
.rp-pill.mid{background:#DCEFEE;color:#1D5E5A}
.rp-pill.strong{background:var(--lv2);color:var(--green-dk)}
.rp-all details{border-bottom:1px solid var(--line)}
.rp-all details:last-child{border-bottom:0}
.rp-all summary{list-style:none;cursor:pointer;padding:12px 2px}
.rp-all summary::-webkit-details-marker{display:none}
.rp-all .rp-bar .lb{display:flex;align-items:center;gap:6px}
.rp-all .rp-bar .lb .chev{width:16px;height:16px;flex:0 0 auto;transition:transform .2s}
.rp-all details[open] .chev{transform:rotate(90deg)}
.rp-items{list-style:none;margin:0 0 12px;padding:0 0 0 4px;display:grid;gap:8px}
.rp-items li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;color:var(--ink-soft);line-height:1.5}
.rp-dots{display:inline-flex;gap:3px}
.rp-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.rp-dots i.on{background:var(--green-dk)}
.rp-dots.low i.on{background:var(--ink)}

/* ④ ⑤ 영역 카드 */
.rp-dc{position:relative}
.rp-dc .hq{font-size:13px;color:var(--gray);font-weight:600;margin:0 0 4px}
.rp-dc h3{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rp-dc h3 .rk{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 auto}
.rp-dc .line{font-size:14.5px;color:var(--gray);margin:6px 0 12px}
.rp-dc .vt{font-size:15px;line-height:1.7;color:var(--ink-soft);margin:12px 0 0}
.rp-dc .score{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.rp-dc .score .rp-track{flex:1 1 auto}
.rp-dc .score b{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap}
.rp-blk{margin-top:16px}
.rp-blk h4{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-dk);margin:0 0 7px}
.rp-blk p{font-size:15px;line-height:1.7}
.rp-blk .sub{font-size:13px;color:var(--gray);margin:-2px 0 8px}
.rp-low{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rp-low li{padding:11px 13px;border-radius:var(--r-sm);background:var(--paper);font-size:14.5px;line-height:1.6}
.rp-low li b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.rp-rx{padding:14px 16px;border-radius:var(--r-sm);background:var(--plate);font-size:15px;line-height:1.75;color:var(--ink)}
.rp-pick{display:block;width:100%;text-align:left;padding:14px 16px 14px 48px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);
  cursor:pointer;position:relative;font-size:15px;line-height:1.7;color:var(--ink-soft);transition:border-color .15s,box-shadow .15s,background .15s}
.rp-pick::before{content:"";position:absolute;left:15px;top:16px;width:20px;height:20px;border-radius:50%;border:2px solid var(--lv3);background:var(--card)}
.rp-pick b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.rp-pick:hover{border-color:var(--green)}
.rp-pick[aria-pressed="true"]{border-color:var(--green);background:var(--plate);box-shadow:0 0 0 2px rgba(31,158,67,.18)}
.rp-pick[aria-pressed="true"]::before{border-color:var(--green-dk);background:var(--green-dk);box-shadow:inset 0 0 0 4px var(--plate)}
.rp-pick.static{cursor:default;padding-left:16px}.rp-pick.static::before{display:none}
.rp-rec{display:grid;gap:6px;font-size:14px;line-height:1.6}
.rp-rec div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.rp-rec span{font-size:12px;font-weight:700;color:var(--gray);letter-spacing:.06em;padding-top:2px}
.rp-third{font-size:14px;color:var(--gray);margin:16px 2px 8px;font-weight:600}
.rp-str{border-left:4px solid var(--green)}
.rp-str .badge{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--green-dk);background:var(--lv2);border-radius:var(--pill);padding:3px 9px;margin-bottom:8px}

/* ⑧ 다음 한 걸음 */
.rp-next{border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-md);padding:22px 20px}
.rp-chosen{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:var(--r-sm);background:var(--plate);margin:4px 0 14px}

.fb-lb{font-size:22px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9FE0B0;margin-top:40px}
.fb-name{font-size:132px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;color:#fff}
.fb-name small{font-size:40px;font-weight:600;color:rgba(255,255,255,.7);margin-left:20px;letter-spacing:0}
.fb-name.idle{font-size:64px;color:rgba(255,255,255,.85)}
.fb-ask{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:28px;font-weight:700;color:rgba(255,255,255,.8)}
.fb-ask span{background:#7CB342;color:#0E1F14;border-radius:50px;padding:8px 22px;font-weight:800}
.fb-cond{font-size:24px;color:rgba(255,255,255,.75);margin-top:14px;line-height:1.5}
.fb-cond b{color:#fff}
.fb-stats{display:flex;gap:24px;margin-top:auto;align-items:stretch}
.fb-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:22px 30px;backdrop-filter:blur(6px)}
.fb-stat b{display:block;font-size:84px;font-weight:800;line-height:1.05;color:#BFF0CB;letter-spacing:-.03em}
.fb-stat span{font-size:22px;color:rgba(255,255,255,.75);font-weight:700}
.fb-timer b{color:#fff}
.fb-timer .tb{display:flex;gap:8px;margin-top:8px}
.fb-btn{min-height:64px;padding:0 34px;border-radius:50px;border:0;font-size:26px;font-weight:800;cursor:pointer;font-family:var(--font)}
.fb-btn.go{background:#1F9E43;color:#fff}
.fb-btn.nx{background:#fff;color:var(--ink)}
.fb-btn.sm{min-height:44px;font-size:18px;padding:0 18px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.fb-ctl{display:flex;gap:14px;margin-top:22px;align-items:center}
.fb-order{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;align-self:end}
.fb-order .h{font-size:20px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:.14em;text-transform:uppercase;margin-right:8px}
.fb-order button{min-height:48px;border-radius:50px;padding:0 20px;font-size:21px;font-weight:700;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);cursor:pointer;font-family:var(--font)}
.fb-order button.done{opacity:.45;text-decoration:line-through}
.fb-order button.live{background:#1F9E43;border-color:#1F9E43;color:#fff}
.fb-order button.next{border-color:#BFF0CB;color:#BFF0CB}
.fb-order button i{font-style:normal;font-size:16px;opacity:.7;margin-left:6px}

body.fb-boardmode .c-top,body.fb-boardmode .c-wrap{display:none}
#v-session .c-tbl td{white-space:nowrap}
/* ── 콘솔 · 세션 ─────────────────────────────────────── */
.fb-mx{border-collapse:collapse;font-size:13px}
.fb-mx th,.fb-mx td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.fb-mx th{background:var(--paper);font-weight:700;color:var(--ink)}
.fb-mx td.y{color:var(--green-dk);font-weight:800}
.fb-mx td.h{color:var(--warn-fg);background:var(--warn-bg)}
.fb-mx td.me{background:#EEF1EF}
.fb-mx td.miss{color:var(--err-fg);font-weight:700}
.fb-tag{white-space:nowrap;display:inline-block;font-size:11px;font-weight:700;border-radius:50px;padding:1px 7px;background:var(--lv2);color:var(--green-dk);margin-left:4px}
.fb-tag.w{background:var(--warn-bg);color:var(--warn-fg)}
.fb-tag.g{background:var(--paper);color:var(--gray)}
.fb-ent{border-top:1px solid var(--line);padding:10px 0}
.fb-ent.hid{opacity:.55}
.fb-ent p{margin:3px 0;font-size:14px;line-height:1.55}
.fb-ent .who{font-size:12.5px;font-weight:700;color:var(--gray)}
.fb-set{display:grid;gap:10px}
.fb-set label.sw{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;min-height:40px}
.fb-set label.sw input{width:20px;height:20px;accent-color:var(--green-dk)}

/* ── 종이 피드백 카드 · 인쇄 ─────────────────────────────── */
.fp-page{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8mm;width:100%;min-height:268mm;break-after:page}
.fp-card{border:1.2px dashed #9AA8A0;border-radius:4mm;padding:6mm;font-size:10.5pt;color:#122420;display:flex;flex-direction:column}
.fp-h{font-weight:800;font-size:11pt;color:#157A34}
.fp-who{margin:2mm 0;font-weight:700}
.fp-fx{font-weight:800;border-left:2px solid #1F9E43;padding-left:2mm;margin:1mm 0 2mm}
.fp-in{margin-top:2mm}
.fp-in b{display:block;font-size:10pt}
.fp-in small{display:block;font-size:8pt;color:#5E6A64}
.fp-in i{display:block;border-bottom:1px solid #C9D3CD;height:7mm}
.fp-chips{margin-top:auto;font-size:8.5pt;color:#24332C;line-height:1.6;padding-top:2mm}
#fb-print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.fb-printing > *:not(#fb-print){display:none!important}
  body.fb-printing #fb-print{display:block}
  .fr-page{break-after:page}
  .fr-page:last-child{break-after:auto}
  .fr-ph{display:block;font-size:10pt;color:#5E6A64;border-bottom:1px solid #E2EBE4;padding-bottom:2mm;margin-bottom:2mm}
  .fr-pf{display:block;font-size:9pt;color:#5E6A64;text-align:right;margin-top:4mm}
  .fr .rp-sec{break-inside:avoid-page;margin-top:14px}
  .fr-grp,.rp-card{box-shadow:none!important;break-inside:avoid}
  .fr .rp-top{padding-top:0}
  .f-top,.f-demo,.f-send,.no-print,.toast{display:none!important}
}

body{background:var(--paper);font-size:15px}
.c-top{position:sticky;top:0;z-index:30;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.c-top .c-logo{width:92px;height:40px;background:var(--logo) left center/contain no-repeat;flex:0 0 auto}
.c-top h1{color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.c-tabs{display:flex;gap:6px}
.c-tab{min-height:38px;padding:.3rem .95rem;border-radius:var(--pill);border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-weight:700;font-size:14px;cursor:pointer}
.c-tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.c-mode{font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:var(--pill);background:var(--lv2);color:var(--green-dk)}
.c-mode.off{background:var(--warn-bg);color:var(--warn-fg)}
.c-wrap{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
.c-view{display:none}.c-view.on{display:block}
.c-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.c-h h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.c-h p{color:var(--gray);font-size:14px;margin-top:4px}
.c-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:18px}
.c-card + .c-card{margin-top:14px}
.c-grid > .c-card,.c-grid > div > .c-card:first-child{margin-top:0}
.c-card h3{font-size:16.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.c-grid{display:grid;gap:14px}
@media (min-width:900px){.c-grid.two{grid-template-columns:1fr 1fr}.c-grid.three{grid-template-columns:1.2fr 1fr 1fr}}
.c-tbl{width:100%;border-collapse:collapse;font-size:14px}
.c-tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gray);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.c-tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.c-tbl tr:last-child td{border-bottom:0}
.c-tbl tr.click{cursor:pointer}.c-tbl tr.click:hover td{background:var(--plate)}
.c-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.c-code{font-weight:800;letter-spacing:.08em;color:var(--ink);font-variant-numeric:tabular-nums}
.c-st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:var(--pill);background:var(--lv2);color:var(--green-dk);white-space:nowrap}
.c-st.off{background:#ECEFED;color:var(--gray)}
.c-st.draft{background:var(--warn-bg);color:var(--warn-fg)}
.c-form{display:grid;gap:12px}
@media (min-width:760px){.c-form.cols{grid-template-columns:1fr 1fr}}
.f{display:block}
.f > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin:0 0 5px;letter-spacing:.01em}
.f > span small{font-weight:600;color:var(--gray);margin-left:4px}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea,.c-in{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;line-height:1.5}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.c-in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,158,67,.15)}
.f input[disabled],.f select[disabled],.f textarea[disabled]{background:var(--paper);color:var(--gray)}
.f .cnt{display:block;text-align:right;font-size:11.5px;color:var(--gray);margin-top:3px}
.f .cnt.over{color:var(--err-fg);font-weight:700}
.f.chk{display:flex;align-items:center;gap:9px;min-height:44px;font-weight:600;color:var(--ink)}
.f.chk input{width:20px;height:20px;accent-color:var(--green-dk)}
.c-note{font-size:13px;color:var(--gray);line-height:1.6}
.c-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.c-link{display:flex;gap:8px}
.c-link input{flex:1 1 auto;min-width:0;font-size:13.5px}
.c-qr{width:180px;height:180px;border:1px solid var(--line);border-radius:14px;padding:6px;background:#fff}
.c-qr svg{width:100%;height:100%;display:block}
.c-back{background:none;border:0;color:var(--green-dk);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px}
.c-chips{display:flex;flex-wrap:wrap;gap:6px}
.c-chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:var(--pill);background:var(--card);border:1px solid var(--line);color:var(--ink-soft)}
.c-hist{display:grid;gap:8px}
.c-hist .r{display:grid;grid-template-columns:minmax(80px,32%) 1fr 54px;gap:10px;align-items:center;font-size:14px}
.c-hist .r .bar{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.c-hist .r .bar i{display:block;height:100%;background:var(--teal)}
.c-hist .r b{text-align:right;font-variant-numeric:tabular-nums}
.c-top3{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.c-top3 li{padding:11px 13px;border-radius:var(--r-sm);background:var(--plate);font-size:14.5px;line-height:1.55}
.c-open{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.c-open li{padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:14.5px;line-height:1.6}
.c-open li small{display:block;color:var(--gray);font-size:12px;margin-top:4px}
.c-empty{padding:26px;text-align:center;color:var(--gray);font-size:14.5px}

/* 편집기 */
.ed-bar{position:sticky;top:60px;z-index:20;background:var(--paper);padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:14px}
.ed-bar select{min-height:40px;max-width:100%;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.ed-bar .sp{flex:1 1 auto}
.ed-bar .btn{padding:.3rem .8rem;font-size:13.5px;min-height:38px}
.ed{display:grid;gap:14px;align-items:start}
@media (min-width:1080px){.ed{grid-template-columns:250px minmax(0,1fr) 330px}}
.ed-nav{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;max-height:calc(100vh - 150px);overflow:auto}
@media (min-width:1080px){.ed-nav{position:sticky;top:130px}}
@media (max-width:1079px){.ed-nav{max-height:300px}}
.ed-nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;min-height:38px}
.ed-nav button:hover{background:var(--paper)}
.ed-nav button.on{background:var(--plate);color:var(--green-dk);font-weight:800}
.ed-nav .grp{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--gray);text-transform:uppercase;padding:12px 10px 4px}
.ed-nav .it{padding-left:26px;font-weight:500;font-size:13px;min-height:32px}
.ed-nav .it i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.ed-nav .it i.off{background:var(--line);border:1px solid #c9d3cc}
.ed-nav .it .c{font-weight:800;font-size:11.5px;color:var(--gray);letter-spacing:.04em}
.ed-nav .cnt{margin-left:auto;font-size:11.5px;color:var(--gray);font-weight:700}
.ed-main{min-width:0}
.ed-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm)}
.ed-sec + .ed-sec{margin-top:14px}
.ed-sec h3{font-size:17px;font-weight:800;margin:0 0 4px}
.ed-sec .c-note{margin:0 0 14px}
.ed-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--card);display:grid;gap:10px}
.ed-item + .ed-item{margin-top:10px}
.ed-item.off{background:#F8FAF8}
.ed-item.sel{border-color:var(--green);box-shadow:0 0 0 2px rgba(31,158,67,.18)}
.ed-item .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-item .hd .code{font-weight:800;letter-spacing:.06em;color:var(--ink);font-size:14px}
.ed-item .hd .sp{flex:1 1 auto}
.ed-sw{display:inline-flex;border:1px solid var(--line);border-radius:var(--pill);overflow:hidden}
.ed-sw button{border:0;background:var(--card);padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--gray);cursor:pointer;min-height:32px}
.ed-sw button[aria-pressed="true"]{background:var(--green-dk);color:#fff}
.ed-sw.rev button[aria-pressed="true"]{background:var(--ink)}
.ico{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:800;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center}
.ico[disabled]{opacity:.35;cursor:default}
.ed-lock{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-fg);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-chk{margin:0 0 14px}
.ed-chk ul{margin:6px 0 0;padding-left:18px}
.ed-chk li{margin:3px 0;font-size:13.5px}
.ed-chk .w{color:var(--warn-fg)}
.ed-side{position:sticky;top:130px}
@media (max-width:1079px){.ed-side{position:static}}
.phone{width:300px;max-width:100%;margin:0 auto;border-radius:34px;border:10px solid var(--ink);background:var(--paper);height:600px;overflow:hidden;position:relative;box-shadow:var(--shadow-lg)}
.phone .pb{height:4px;background:var(--line)}.phone .pb i{display:block;height:100%;background:var(--green)}
.phone .in{padding:14px 14px;height:calc(100% - 4px);overflow:auto;font-size:13px}

<script>

  }

  /* ── 주소 · 요청의 이름(전송 이름) ─────────────────────────
     Apps Script 웹앱(/exec)은 쿼리 이름 'c' 를 가로채 400 을 낸다(2026-10-25 실서버에서 확인). 한 글자 이름을 모두 두 글자 이상으로 바꿔 보낸다.
     코드 안에서는 짧은 이름(a · c · r · k · s · t)을 그대로 쓰고, 보낼 때 toWire · 받을 때 fromWire 로 바꾼다. 받은 쪽은 한 글자 이름을 버린다(옛 이름 호환 없음).
     fb.js 의 WIRE 와 같은 표다 — test_logic.js 가 둘이 같은지 본다. */
  var WIRE = { a: 'act', c: 'co', r: 'rk', k: 'key', s: 'ses', t: 'tok' };
  function toWire(o) { var x = {}; Object.keys(o || {}).forEach(function (k) { x[own(WIRE, k) ? WIRE[k] : k] = o[k]; }); return x; }
  function fromWire(o) {

  /* ── 템플릿 읽기 ──────────────────────────────────────── */
  function ref(tpl) { return tpl.id + '@v' + tpl.version; }
  function scaleMin(tpl) { return Math.min.apply(null, tpl.scale.points.map(function (p) { return Number(p.v); })); }
  function scaleMax(tpl) { return Math.max.apply(null, tpl.scale.points.map(function (p) { return Number(p.v); })); }
  function onItems(d) { return d.items.filter(function (it) { return it.on; }); }
  function sequence(tpl) {                    // 응답 순서 — 영역 순서대로 켠 문항
    var a = [];
    tpl.domains.forEach(function (d) { onItems(d).forEach(function (it) { a.push({ code: it.code, domain: d.code, rev: !!it.rev, text: it.text }); }); });
    return a;
  }
  function domainOf(tpl, code) { for (var i = 0; i < tpl.domains.length; i++) if (tpl.domains[i].code === code) return tpl.domains[i]; return null; }
  function itemOf(tpl, code) {
    for (var i = 0; i < tpl.domains.length; i++) for (var j = 0; j < tpl.domains[i].items.length; j++) if (tpl.domains[i].items[j].code === code) return tpl.domains[i].items[j];
    return null;
  }
  function layerOf(tpl, d) {
    var ls = tpl.layers || [];
    for (var i = 0; i < ls.length; i++) if (ls[i].name === d.layer) return ls[i];

  }
  /** 층 순위 — 쌓는 순서 1(아래)부터. 순서 0(층 밖 · 출발점)과 층이 없는 영역은 맨 뒤 */
  function layerRank(tpl, d) { var l = layerOf(tpl, d); return l && Number(l.order) >= 1 ? Number(l.order) : 99; }
  function stackLayers(tpl) {
    return sortStable((tpl.layers || []).filter(function (l) { return Number(l.order) >= 1; }), function (a, b) { return Number(a.order) - Number(b.order); });
  }
  function totalSteps(tpl) {
    return (tpl.choice ? 1 : 0) + (tpl.ladder ? tpl.ladder.items.length : 0) + sequence(tpl).length + (tpl.open || []).length;
  }

  /* ── 점수 ─────────────────────────────────────────────── */
  function scored(tpl, v, rev) {
    var n = Number(v), lo = scaleMin(tpl), hi = scaleMax(tpl);
    if (v === null || v === undefined || v === '' || !isFinite(n) || n !== Math.round(n) || n < lo || n > hi) return null;
    return rev ? lo + hi - n : n;
  }
  function to100(tpl, mean) { var lo = scaleMin(tpl), hi = scaleMax(tpl); return mean === null ? null : (mean - lo) / (hi - lo) * 100; }
  function verdictOf(tpl, v) {
    if (v === null || v === undefined) return null;
    if (v < Number(tpl.verdict.weak) - EPS) return 'weak';
    if (v >= Number(tpl.verdict.strong) - EPS) return 'strong';
    return 'mid';
  }
  /** 표시 점수 — 정수로 반올림하되, 판정선 바로 아래 값이 선 위로 올라가 보이지 않게 한다 (59.6 → 59) */
  function disp(tpl, v) {

  /**

  function score(tpl, resp, opt) {
    resp = resp || {}; opt = opt || {};
    var P = {}, k, base = tpl.priority || {};

    var lad = ladderStage(tpl, resp.ladder || {});
    var lowMax = Number(tpl.verdict.lowMax || 2), lowShow = Number(tpl.verdict.lowShow || 2);
    var doms = tpl.domains.map(function (d) {

        var v = scored(tpl, ans[it.code], it.rev);

      });

      var raw = vals.length === items.length && vals.length ? r6(to100(tpl, mean)) : null;
      var low = sortStable(items.filter(function (x) { return x.v !== null && x.v <= lowMax; }), function (a, b) { return a.v - b.v; })
        .slice(0, lowShow).map(function (x) { return x.code; });
      var layer = layerOf(tpl, d);
      return { code: d.code, raw: raw, score: disp(tpl, raw), verdict: verdictOf(tpl, raw), layer: d.layer || '', rank: layerRank(tpl, d),
               bonus: layer ? Number(layer.bonus) || 0 : 0, low: low, items: items };
    });
    var complete = !missing.length;
    // 층 — 그 층 영역 점수의 평균. 층 밖(순서 0)은 막대에 넣지 않는다

  function cardSlots(tpl, res, ctx) {
    ctx = ctx || {};

      self: selfOn(tpl).map(function (x) { return { code: x.code, q: x.q, a: clip(selfA[x.code], LIMIT.text) }; }).filter(function (x) { return x.a; }),
      selfDone: !!selfE,

  /** 결과 카드 문구 — 강사의 좋았던 점 1줄 + 가장 많이 짚은 좋았던 항목의 동료 글(40자 이하)로 세 줄까지 */

    rep.good.forEach(function (g) {
      g.list.forEach(function (x) { if (lines.length < 3 && x.text.length <= LIM && lines.indexOf(x.text) < 0) lines.push(x.text); });
    });

    return {
      head: T(tpl, 'card', '카드-머리', { '과정': rep.course }), name: T(tpl, 'card', '카드-이름', { '이름': rep.name }),
      date: rep.date, nextTitle: T(tpl, 'card', '카드-다음 제목'), next: rep.next || rep.nextDefault || '',

  /* ── 참가자 화면 규칙 (PRD 7-2 · 7-3) ─────────────────────

    if (opt.override && opt.override !== me) return 'write';

  /** 전환 예비 — 마지막으로 서버 응답을 받은 지 15초가 넘으면 [직접 고르기]를 펼친다 */

  /* ── 세션 · 명단 ──────────────────────────────────────── */
  function isReleased(ses, r) { return str(ses.released) === 'all' || truthy(r && r.released); }
  function orderOf(roster) { return roster.slice().sort(function (a, b) { return Number(a.order) - Number(b.order); }); }

    var o = orderOf(roster);

    return null;

  /* ── Api — 시트 · 데모 저장소 공용 ─────────────────────────

    function find(code) {

      if (!code) return null;

    }
    function rosterOf(code) { return orderOf(store.all(TABS.roster).filter(function (r) { return str(r.session) === code; })); }

    function bump(ses, patch) { patch = patch || {}; patch.rev = Number(ses.rev || 0) + 1; store.patch(TABS.sessions, ses._row, patch); changed(str(ses.session)); }
    function closed(ses) { return str(ses.status) !== OPEN; }
    function settingsOf(ses) {

    }

    }
    function person(r, roster, tpl, ses) {
      var o = orderOf(roster), k = 0;
      o.forEach(function (x, i) { if (str(x.pid) === str(r.pid)) k = i + 1; });
      var codes = setItems(tpl, str(ses.set)).map(function (it) { return it.code; }), cv = json(r.cond_json, {});
      return { pid: str(r.pid), name: str(r.name), k: k, m: o.length, ask: json(r.ask, []).filter(function (c) { return codes.indexOf(c) >= 0; }),
               cond: tpl.cond.map(function (c) { return { label: c.label, value: clip(cv[c.key], LIMIT.cond) }; }).filter(function (c) { return c.value; }) };
    }
    function peerEntry(code, from, to, role) {

    }

    var RX_EID = /^[a-z0-9]{8,24}$/;

    /* 참가자 — 공개(세션 코드) */
    function session(q) {
      var ses = find(q.s); if (!ses) return { ok: false, error: 'session' };
      var tpl = tplOf(ses); if (!tpl) return { ok: false, error: 'tpl' };
      return { ok: true, session: pubSession(ses), tpl: publicTemplate(tpl),
               roster: rosterOf(str(ses.session)).map(function (r) { return { pid: str(r.pid), name: str(r.name), order: Number(r.order), joined: !!str(r.tokenHash), added: truthy(r.added) }; }) };
    }
    function join(b) {
      var ses = find(b.s); if (!ses) return { ok: false, error: 'session' };

      var code = str(ses.session), roster = rosterOf(code), r = null;
      if (str(b.pid)) {
        r = roster.filter(function (x) { return str(x.pid) === str(b.pid); })[0];

      } else {
        var nm = clip(b.name, LIMIT.name);
        if (!nm) return { ok: false, error: 'name' };
        r = roster.filter(function (x) { return str(x.name) === nm; })[0] || null;
        if (!r) {
          if (!truthy(ses.walkIn)) return { ok: false, error: 'walkin' };

          r = tx(function () {
            var fresh = rosterOf(code), same = fresh.filter(function (x) { return str(x.name) === nm; })[0];
            if (same) return same;
            var w = fresh.filter(function (x) { return /^W/.test(str(x.pid)); }).length + 1, mx = 0;
            fresh.forEach(function (x) { mx = Math.max(mx, Number(x.order) || 0); });
            store.add(TABS.roster, { session: code, pid: 'W' + pad2(w), name: nm, order: mx + 1, added: 'TRUE', tokenHash: '', joinedAt: '', ask: '', cond_json: '',
                                     startedAt: '', endedAt: '', released: '', next: '' });
            return rosterOf(code).filter(function (x) { return str(x.name) === nm; })[0];
          });
        }

        next: nx ? { pid: str(nx.pid), name: str(nx.name) } : null, allDone: !nx && !truthy(ses.live) && !!cur,
        me: { pid: str(me.pid), name: str(me.name), presented: !!str(me.startedAt), live: str(ses.current) === str(me.pid) && truthy(ses.live),
              selfDone: !!selfE, released: isReleased(ses, me), isNext: !!nx && str(nx.pid) === str(me.pid),

    }
    function request(b) {
      var a = auth(b); if (a.error) return { ok: false, error: a.error };

      var tpl = tplOf(a.ses), codes = setItems(tpl, str(a.ses.set)).map(function (it) { return it.code; }), patch = {};

        var ask = (Array.isArray(b.ask) ? b.ask : []).map(str).filter(function (c, i, arr) { return codes.indexOf(c) >= 0 && arr.indexOf(c) === i; });
        if (ask.length > Number(tpl.ask.max || 2)) return { ok: false, error: 'askMax' };
        patch.ask = JSON.stringify(ask);
      }

        var cv = {}; tpl.cond.forEach(function (c) { var v = clip(b.cond && b.cond[c.key], LIMIT.cond); if (v) cv[c.key] = v; });

      /* 잠금 없이 받는다 — 세션 줄(rev)을 고치지 않고, 새 글은 한 줄 붙이기(원자적), 고치기는 자기 줄만.
         클라이언트가 처음 만든 글 ID(eid)를 다시 보내면(재시도) 그 줄을 고친다 — 중복 줄 0 */

      if (old && str(old.to) === str(to.pid)) { row.editedAt = iso(); store.patch(TABS.entries, old._row, row); return { ok: true, eid: str(old.eid), edited: true }; }
      row.ts = iso(); row.session = code; row.eid = cid || newEid(); row.to = str(to.pid); row.from = str(a.me.pid); row.role = 'peer'; row.hidden = 'FALSE'; row.editedAt = ''; row.self_json = '';
      var at = store.add(TABS.entries, row);                  // 시트 저장소는 잠금 안에서 붙이고 확인한다
      return { ok: true, eid: row.eid, edited: false, row: at || undefined };
    }
    /** 동료 · 강사 피드백 한 줄 — 필수 · 칩 · 점수 검사 */
    function entryRow(tpl, ses, b, coach) {
      var setCode = str(ses.set), codes = setItems(tpl, setCode).map(function (it) { return it.code; });
      var good = clip(b.good, LIMIT.text), better = clip(b.better, LIMIT.text), last = truthy(ses.oneLine) ? clip(b.last, LIMIT.last) : '';
      if (!coach && ((inputOf(tpl, 'good') || {}).required && !good || (inputOf(tpl, 'better') || {}).required && !better)) return { error: 'required' };
      if (coach && !good && !better && !last) return { error: 'required' };
      var sc = {};
      if (truthy(ses.score)) {
        sc = cleanScores(tpl, setCode, b.scores);

    }

        var to = names[str(e.to)];
        return { eid: str(e.eid), to: str(e.to), toName: to ? str(to.name) : '', good: str(e.good), goodItem: str(e.goodItem), better: str(e.better),
                 betterItem: str(e.betterItem), last: str(e.last), scores: json(e.score_json, {}), ts: str(e.editedAt) || str(e.ts),

    }
    function selfSave(b) {
      var a = auth(b); if (a.error) return { ok: false, error: a.error };

      if (!any) return { ok: false, error: 'required' };

                                     betterItem: '', last: '', score_json: '', self_json: JSON.stringify(ans), hidden: 'FALSE', editedAt: '' });
      changed(code);                                          // 세션 줄은 고치지 않고 now 캐시만 새로(잠금 없는 쓰기)

    }

      var code = str(a.ses.session), tpl = tplOf(a.ses);
      return { ok: true, released: true, report: buildReport(tpl, a.ses, rosterOf(code), entriesOf(code), str(a.me.pid), { minGroup: minG() }), kakao: truthy(a.ses.kakao) };
    }
    function nextSave(b) {
      var a = auth(b); if (a.error) return { ok: false, error: a.error };
      if (!isReleased(a.ses, a.me)) return { ok: false, error: 'notYet' };

    }
    /** 담당자 보기(회차 담당자 키) — 세션 전체의 항목 빈도만. 쓴 사람이 3명 미만이면 숨김 */

      if (!co || !str(q.k) || str(q.k) !== str(co.staffKey)) return { ok: false, error: 'denied' };

      });

    }

    /* 코치 — 마스터 키 뒤 */
    function newCode() {
      var used = {}; store.all(TABS.sessions).forEach(function (s) { used[str(s.session)] = 1; });
      for (var t = 0; t < 80; t++) { var c = ''; for (var i = 0; i < 4; i++) c += CODE_CHARS.charAt(Math.floor(Math.random() * CODE_CHARS.length)); if (!used[c]) return c; }
      throw new Error('code');
    }
    function addNames(code, names) {

      roster.forEach(function (r) { mx = Math.max(mx, Number(r.order) || 0); have[str(r.name)] = 1; var m = str(r.pid).match(/^P(\d+)$/); if (m) pn = Math.max(pn, Number(m[1])); });
      var n = 0;
      names.forEach(function (nm) {

      store.add(TABS.sessions, { session: code, cohort: co ? str(b.cohort).toUpperCase() : '', tpl: ref(tpl), title: clip(b.title, LIMIT.title) || (co && co.display) || tpl.name,
        date: clip(b.date, 20), mode: mode, set: set, current: '', live: 'FALSE', self: flag(pick('self')), oneLine: flag(pick('oneLine')), score: flag(pick('score')),

      if (prev && truthy(ses.live) && str(prev.pid) !== pid && !str(prev.endedAt)) store.patch(TABS.roster, prev._row, { endedAt: iso() });

    }

        case 'report':
          var rep = buildReport(tpl, ses, rosterOf(code), entriesOf(code), str(b.pid), { coach: true, minGroup: minG() });
          return rep ? { ok: true, report: rep } : { ok: false, error: 'pid' };
        case 'printAll':
          var rs = rosterOf(code), es = entriesOf(code);
          return { ok: true, session: pubSession(ses), reports: rs.filter(function (r) { return !!str(r.startedAt) || es.some(function (e) { return str(e.to) === str(r.pid); }); })
            .map(function (r) { return buildReport(tpl, ses, rs, es, str(r.pid), { minGroup: minG() }); }) };

          else { row.ts = iso(); row.session = code; row.eid = newEid(); row.to = str(to.pid); row.from = COACH; row.role = 'coach'; row.hidden = 'FALSE'; row.editedAt = ''; row.self_json = ''; store.add(TABS.entries, row); }

  /* ── 저장소 ───────────────────────────────────────────── */

<script>
/* 과정 도구 · 피드백 카드 — 화자 리포트 · 전체 인쇄 · 종이 카드 그리기 (FbReport)
   PRD 7-6(화면 0 ~ ⑧) · 7-7(전체 리포트 인쇄 · 종이 피드백 카드). 글자는 모두 템플릿 text 에서 온다(X(그룹, 키)).
   참가자 화면(내 리포트)과 코치 콘솔(전체 인쇄 · 미리 보기)이 같은 그리기를 쓴다.
   FbReport.render(rep, tpl, opt) → html   opt: { next: true(다음 하나 입력) · card: true(카드 미리보기 · 저장 단추) · kakao · print · coach }

(function (root) {

    }
    function quote(x) {

    }

        return '<div class="fr-grp' + (g.asked ? ' asked' : '') + '"><div class="fr-gh"><span class="fr-chip' + (g.code ? '' : ' none') + '">' + esc(g.code ? g.chip : noneLabel) + '</span>' +
          (g.asked ? '<span class="fr-ask" title="' + esc(X('rhead', '봐 달라고 한 항목-없음').split(' · ')[0]) + '">★</span>' : '') +
          '<span class="fr-n num">' + esc(X('rtitle', '묶음 표기', { n: g.list.length })) + '</span></div><ul class="fr-list">' + g.list.map(quote).join('') + '</ul></div>';
      }).join('');
    }

    /* 0 머리 */
    h.push('<div class="rp fr" id="fr-root">');
    h.push('<header class="rp-top"><span class="rp-logo" role="img" aria-label="' + esc(X('end', '끝 줄1')) + '"></span><span class="rp-chip"><i></i>' + esc(rep.course) + '</span></header>');
    h.push('<section class="rp-head fr-head" id="fr-s0"><p class="rp-meta">' + esc(X('rhead', '머리 정보', { '과정': rep.course, '날짜': rep.date })) + '</p>' +
      '<h1>' + esc(X('rhead', '제목', { '이름': rep.name })) + '</h1>' +
      '<p class="fr-lead">' + esc(X('rhead', '머리말', { n: rep.n })) + '</p>' +
      '<div class="fr-tags"><span class="fr-tag num">' + esc(X('rhead', '받은 수', { n: rep.n, m: rep.m })) + '</span>' +
      '<span class="fr-tag">' + esc(rep.askChips.length ? X('rhead', '봐 달라고 한 항목', { '항목': rep.askChips.join(' · ') }) : X('rhead', '봐 달라고 한 항목-없음')) + '</span></div>' +
      (rep.cond.length ? '<p class="fr-cond">' + esc(X('rhead', '화자 조건 머리')) + ' · ' +
        rep.cond.map(function (c) { return '<b>' + esc(c.label) + '</b> ' + esc(c.value); }).join(' · ') + '</p>' : '') +
      '<p class="rp-callout fr-fixed">' + esc(rep.showWriter ? X('rhead', '고정-이름 표시 세션') : X('rhead', '고정')) + '</p></section>');

    /* ① 강사 */
    h.push('<section class="rp-sec" id="fr-s1">' + sh(1, X('rtitle', '제목①'), X('rtitle', '설명①')));
    if (rep.coach.length) rep.coach.forEach(function (c) {
      h.push('<div class="rp-card fr-coach"><p class="fr-fx">' + esc(tpl.fixed.text) + '</p>' +
        (c.good ? '<div class="fr-row"><b>' + esc(F.inputOf(tpl, 'good').label) + '</b>' + (c.goodChip ? '<span class="fr-chip sm">' + esc(c.goodChip) + '</span>' : '') + '<p>' + esc(c.good) + '</p></div>' : '') +
        (c.better ? '<div class="fr-row"><b>' + esc(F.inputOf(tpl, 'better').label) + '</b>' + (c.betterChip ? '<span class="fr-chip sm">' + esc(c.betterChip) + '</span>' : '') + '<p>' + esc(c.better) + '</p></div>' : '') +
        (c.last ? '<div class="fr-row"><b>' + esc(F.inputOf(tpl, 'last').label) + '</b><p>' + esc(c.last) + '</p></div>' : '') + '</div>');
    });
    else h.push('<p class="fr-empty">' + esc(X('coach', '없음')) + '</p>');
    h.push('</section>');

    /* ② 좋았던 점 */
    h.push('<section class="rp-sec" id="fr-s2">' + sh(2, X('rtitle', '제목②'), X('rtitle', '설명②')));
    h.push(rep.good.length ? groups(rep.good, X('rtitle', '칩 없음 묶음')) : '<p class="fr-empty">' + esc(X('before', '받은 것 없음')) + '</p>');
    h.push('</section>');

    /* ③ 남은 한 문장 */
    if (rep.last.length || opt.coach) {
      h.push('<section class="rp-sec" id="fr-s3">' + sh(3, X('rtitle', '제목③'), X('rtitle', '설명③')));
      h.push(rep.last.length ? '<ol class="fr-last">' + rep.last.map(function (x) {
        return '<li><span class="fr-q">' + esc(x.text) + '</span><span class="fr-cnt num">' + esc(X('rtitle', '묶음 표기', { n: x.n })) + '</span></li>';
      }).join('') + '</ol>' : '<p class="fr-empty">' + esc(X('before', '받은 것 없음')) + '</p>');
      h.push('</section>');
    }

    /* ④ 개선할 점 */
    h.push('<section class="rp-sec" id="fr-s4">' + sh(4, X('rtitle', '제목④'), X('rtitle', '설명④')));
    h.push(rep.better.length ? groups(rep.better, X('rtitle', '칩 없음 묶음')) : '<p class="fr-empty">' + esc(X('before', '받은 것 없음')) + '</p>');
    h.push('</section>');

    /* ⑤ 항목 모아 보기 (+ 평가 기준 점수) */
    var mx = 1; rep.freq.forEach(function (f) { mx = Math.max(mx, f.good, f.better); });
    var shown = rep.freq.filter(function (f) { return f.good || f.better || f.asked; });
    h.push('<section class="rp-sec" id="fr-s5">' + sh(5, X('rtitle', '제목⑤'), X('rtitle', '설명⑤')));
    h.push('<div class="rp-card fr-freq"><div class="fr-legend"><span><i class="g"></i>' + esc(X('rtitle', '막대 라벨-좋았던')) + '</span><span><i class="b"></i>' + esc(X('rtitle', '막대 라벨-개선')) + '</span></div>' +
      (shown.length ? shown.map(function (f) {
        return '<div class="fr-bar' + (f.asked ? ' asked' : '') + '"><div class="lb">' + (f.asked ? '<span class="fr-ask">★</span>' : '') + esc(f.chip) + '</div>' +
          '<div class="tr"><span class="g" style="width:' + Math.round(f.good / mx * 100) + '%"></span><b class="num">' + f.good + '</b></div>' +
          '<div class="tr"><span class="b" style="width:' + Math.round(f.better / mx * 100) + '%"></span><b class="num">' + f.better + '</b></div></div>';
      }).join('') : '<p class="fr-empty">' + esc(X('before', '받은 것 없음')) + '</p>') + '</div>');
    if (rep.score) {
      var S = rep.score, dash = '\u2013';
      /* 동료가 3명 미만이면 동료 평균 대신 안내 한 줄 — 줄에는 강사 점수만 남긴다(템플릿 줄의 마지막 ' · ' 뒤가 강사 부분) */
      function coachOnly(line, head) { var parts = line.split(' \u00B7 '); return (head ? head + ' \u00B7 ' : '') + parts[parts.length - 1]; }
      h.push('<div class="rp-card fr-score"><h3>' + esc(X('rtitle', '제목⑤-점수')) + '</h3>' +
        (S.total.hidden ? '<p class="fr-note fr-scmin">' + esc(X('score', '평균 3명 미만', { n: S.total.n })) + '</p>' : '') +
        S.areas.map(function (a) {
          var line = X('score', '리포트-영역 줄', { '\uC601\uC5ED': a.name, x: a.peer === null ? dash : a.peer, y: a.coach === null ? dash : a.coach });
          return '<div class="fr-sc"><p class="num">' + esc(a.hidden ? coachOnly(line.replace(a.name + ' ', ''), a.name) : line) + '</p>' +
            '<div class="fr-sct"><span class="p" style="width:' + (a.peer === null ? 0 : Math.round(a.peer / a.max * 100)) + '%"></span></div>' +
            '<div class="fr-sct c"><span class="c" style="width:' + (a.coach === null ? 0 : Math.round(a.coach / a.max * 100)) + '%"></span></div></div>';
        }).join('') +
        '<p class="fr-sctot num">' + esc((function () {
          var line = X('score', '리포트-합계 줄', { x: S.total.peer === null ? dash : S.total.peer, y: S.total.coach === null ? dash : S.total.coach });
          return S.total.hidden ? coachOnly(line, line.split(' ')[0]) : line;
        }())) + '</p>' +
        '<p class="fr-note">' + esc(X('score', '리포트-설명')) + '</p></div>');
    }
    h.push('</section>');

    /* ⑥ 셀프 */
    h.push('<section class="rp-sec" id="fr-s6">' + sh(6, X('rtitle', '제목⑥'), X('rtitle', '설명⑥')));
    h.push(rep.self.length ? '<div class="rp-card fr-self">' + rep.self.map(function (x) { return '<div class="fr-row"><b>' + esc(x.q) + '</b><p>' + esc(x.a) + '</p></div>'; }).join('') + '</div>'
      : '<p class="fr-empty">' + esc(X('rtitle', '셀프 없음')) + '</p>');
    h.push('</section>');

    /* ⑦ 받는 법 · 다음 하나 */
    var nextVal = rep.next || rep.nextDefault || '';
    h.push('<section class="rp-sec" id="fr-s7">' + sh(7, X('rtitle', '제목⑦'), X('rtitle', '설명⑦')));
    h.push('<div class="rp-card fr-recv"><h3>' + esc(X('receive', '머리')) + '</h3><ol>' + tpl.receive.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ol></div>');
    if (opt.next) {
      h.push('<div class="rp-card fr-next"><label for="fr-next-in">' + esc(X('next', '입력 라벨')) + '</label><p class="fr-note">' + esc(X('next', '입력 안내')) + '</p>' +

        (!rep.next && rep.nextDefault ? '<p class="fr-note">' + esc(X('next', '미리 채움')) + '</p>' : '') +
        '<div class="fr-btns"><button type="button" class="btn btn-primary btn-sm" id="fr-next-save">' + esc(X('next', '단추-저장')) + '</button><span class="fr-note" id="fr-next-msg"></span></div></div>');
    } else if (nextVal) {
      h.push('<div class="rp-card fr-next"><b>' + esc(X('next', '입력 라벨')) + '</b><p class="fr-nextv">' + esc(nextVal) + '</p></div>');
    }
    h.push('</section>');

    /* ⑧ 저장 */
    if (opt.card) {
      h.push('<section class="rp-sec no-print" id="fr-s8">' + sh(8, X('rtitle', '제목⑧')) +
        '<figure class="fr-preview" id="fr-preview" hidden><img id="fr-preview-img" alt=""></figure>' +
        '<div class="fr-btns"><button type="button" class="btn btn-primary" id="fr-card">' + esc(X('card', '단추-카드')) + '</button>' +
        '<button type="button" class="btn btn-line" id="fr-print">' + esc(X('card', '단추-인쇄')) + '</button></div></section>');
    }
    h.push('<footer class="fr-end"><p>' + esc(X('end', '끝 줄1')) + '</p>' + (opt.kakao ? '<p>' + esc(X('end', '끝 줄2')) + '</p>' : '') + '</footer>');
    h.push('</div>');
    return h.join('');
  }

  /** 전체 리포트 인쇄 — A4, 화자마다 새 쪽(1~2쪽), 순서대로 */
  function printAll(reports, tpl, session) {
    function X(g, k, v) { return F.T(tpl, g, k, v); }
    return reports.map(function (rep) {
      return '<article class="fr-page"><p class="fr-ph">' + esc(X('rprint', '인쇄 머리', { '과정': rep.course, '이름': rep.name })) + '</p>' +
        render(rep, tpl, { kakao: false }) +
        '<p class="fr-pf">' + esc(X('rprint', '인쇄 바닥', { '날짜': rep.date || (session && session.date) || '' })) + '</p></article>';
    }).join('');
  }

  /** 종이 피드백 카드 — 같은 틀을 A4 한 쪽에 네 장(연결이 안 될 때) */
  function paper(tpl, setCode, client, title) {
    function X(g, k, v) { return F.T(tpl, g, k, v); }
    var items = F.setItems(tpl, setCode);
    var one = '<div class="fp-card"><p class="fp-h">' + esc(title || tpl.name) + '</p>' +
      '<p class="fp-who">' + esc(X('listen', '지금 화자', { '이름': '', k: '', m: '' }).replace(/[\s(/)]+$/g, '')) + ' ____________</p>' +
      '<p class="fp-fx">' + esc(tpl.fixed.text) + '</p>' +
      tpl.inputs.map(function (i) {
        return '<div class="fp-in"><b>' + esc(i.label) + (i.required ? ' *' : '') + '</b><small>' + esc(i.guide) + '</small><i></i><i></i></div>';
      }).join('') +
      '<p class="fp-chips">' + items.map(function (it) { return '□ ' + esc(it.chip); }).join('  ') + '</p></div>';
    var cards = [];
    for (var i = 0; i < 4; i++) cards.push(one);
    return '<article class="fp-page">' + cards.join('') + '</article>';
  }

  root.FbReport = { render: render, printAll: printAll, paper: paper, esc: esc };
}(typeof self !== 'undefined' ? self : this));

</script>

다.","세트 바꾸기 막음":"이미 받은 피드백이 있어 관찰 세트를 바꿀 수 없습니다."},"err":{"전환 지연":"화면이 바뀌지 않으면 아래에서 발표자를 직접 고르십시오.","단추-직접 고르기":"발표자 직접 고르기","직접 고르기 안내":"지금 발표하는 사람을 고르십시오. 코치 화면과 다르면 코치 화면이 우선합니다.","연결 끊김":"인터넷 연결이 끊겼습니다. 쓰는 내용은 이 기기에 저장되고 있습니다. 연결되면 이어서 보냅니다.","세션 없음":"이 링크의 세션을 찾을 수 없습니다. 코치에게 확인해 주십시오.","세션 마감":"이 세션은 마감되었습니다. 더 보낼 수 없습니다. 공개된 리포트는 계속 볼 수 있습니다.","입장 표시 없음":"이 기기에 입장 표시가 없습니다. 이름을 다시 고르십시오.","자기 자신":"자기 발표에는 피드백을 쓸 수 없습니다. 셀프 피드백을 쓰십시오.","데모 모드":"데모 모드입니다. 가짜 세션이라 쓴 내용은 저장되지 않습니다."}},"notes":{"rulesMd":"> **파싱 규칙**\n> - 모든 값은 `- 키: 값` 한 줄이다. 키에는 쌍점(:)을 넣지 않는다. 값에는 넣어도 된다(첫 쌍점에서 나눈다). 키 이름과 순서는 같은 종류의 블록 안에서 바꾸지 않는다.\n> - `## 템플릿` · `## 모드 기본값` 은 템플릿 메타다.\n> - 관찰 세트는 `## 관찰 세트 코드 · 이름` 하나에 세트 하나다. 세트 머리 필드 8개 — **이름 / 상태 / 쓰임 / 항목 수 / 칩 묶음 / 캡션 / 캡션 출처 / 원천** 순서.\n> - 세트 안의 `### 영역 코드 · 이름` 은 영역 블록이다(평가표 세트만 있다). 필드 4개 — **이름 / 원문 이름 / 순서 / 소계 만점** 순서.\n> - 세트 안의 `### 코드 · 칩 이름` 은 관찰 항목이다. 필드 7개 — **칩 / 문장 / 원문 / 고객사 판 / 원천 / 짝 영역 / 상태** 순서. 평가표 세트의 항목은 코드 앞 두 글자로 영역을 정한다. 영역 블록이 없는 세트는 칩을 한 줄로 늘어놓는다.\n> - 관찰 항목 코드는 **영문 대문자 2자 + 숫자 2자**다(`KW01`). 앱 ①의 영역 코드(ME · AU · KN · ST · SL · VO · BO · RH)와 겹치지 않게 골랐다. 셀프 질문(`SF01`~`SF06`)도 같은 꼴이다.\n> - `칩`은 6자 이내(공백 포함)다. `문장`이 화면에 나오는 관찰 질문이다. `원문`은 평가표 또는 교재의 글자 그대로다. `고객사 판`은 고객사 회차에서 `문장` 대신 쓰는 판이고, 없으면 `(범용과 같음)`이다.\n> - `상태`는 세트에서 `기본` 또는 `예비`, 항목과 셀프 질문에서 `켬` 또는 `끔`이다. 예비 세트는 세션 설정에서 고르면 쓰인다.\n> - `## 발표 조건` 아래 `### 라벨 · 원문` 마다 필드 4개 — **라벨 / 안내 / 원문 / 필수** 순서.\n> - `## 입력란` 아래 `### 입력란 n · 라벨` 마다 필드 9개 — **라벨 / 안내 / 예시 / 필수 / 최소 글자 / 항목 칩 / 칩 안내 / 켜고 끄기 / 출처** 순서. (관찰 항목의 `칩`과 헷갈리지 않게 키 이름을 `항목 칩`으로 둔다)\n> - `## 셀프 피드백` 아래 `### SFnn · 짧은 이름` 마다 필드 5개 — **질문 / 안내 / 상태 / 필수 / 출처** 순서.\n> - `원천` · `출처` · `원문 출처` · `캡션 출처` · `짝 영역`은 내부 기록이다. 화면에 내보내지 않는다. `교재 Lnnn`은 `work/02_원고/20261006_Presentation_구글교재_원고_v3.1.md`의 행, `덱 Snnn`은 `work/02_원고/20260926_다말하지마세요_강의덱_원고.md`의 장 번호, `평가표`는 `work/01_기획/20261019_PT피드백_평가표_원본.md`다.\n> - 화면 문구의 `{이름}` · `{n}` · `{m}` · `{과정}` · `{날짜}` · `{항목}` 같은 중괄호는 앱이 값으로 바꾼다. `[단추]` 꼴은 단추 이름이다.\n> - `★기획값`은 교재 · 평가표에 근거가 없는 숫자다. `★피터 확인`은 피터의 답을 기다리는 값이다. 둘 다 권고안으로 채워 두었다.","checksMd":"판단이 갈린 곳이다. 모두 권고안대로 썼다. 피터가 다르게 정하면 이 파일만 고친다.\n\n1. **템플릿 ID와 묶음** — 지시대로 `pt-feedback-v1` · 시트 약칭 `FB` · 버전 1로 따로 세웠다. PRD 5-1은 진단과 피드백을 템플릿 하나(`PT@v1`)의 두 부분으로 그렸다. 두 체계를 잇기 위해 `- 짝 진단 템플릿: pt-ready-v1 (시트 약칭 PT)`를 두었다. 앱 ① 원고의 `- 피드백 부분:` 줄이 이 원고를 가리키도록 build.py가 묶는다. 시트 탭 이름(`tpl_fb_items` 등)은 PRD 8-3을 따른다.\n2. **평가표가 기본 세트** — PRD 7-9대로 평가표 15항목을 기본(`EV`)으로, 교재 22 오프라인 세트를 예비(`OF`)로 내렸다. 온라인 세션은 `ON`을 기본으로 둔다(모드 기본값 두 줄). 평가표에는 온라인 항목이 없기 때문이다.\n3. **OF03 내용 구성의 첫 문장** — 교재 원문은 \"도입·본론·증거가 구분되었는가.\"다. 지시는 원문 그대로였지만, PRD 7-4가 로켓 모델 정의 충돌(교재 vs canon)을 피하려고 \"무엇을 말할지 먼저 예고했는가.\"로 바꾸었고 피터가 PRD를 승인했다. 그래서 `문장`은 PRD 판, `원문`은 교재 판으로 둘 다 실었다. 원문으로 되돌리려면 `문장` 한 줄만 고친다.\n4. **고객사 전용 두 항목의 범용 판** — 평가표 원본 파일은 \"청중의 유익\" · \"근거(출처 · 수치)\"로 일반화하자고 적었다. 원문의 말투(Key Message · Benefit · Data)를 살리려고 **원문에서 최소한만 뺐다.** KW02는 '환자 및'을 빼고, KW04는 '저널명'을 '출처'로 바꿨다. 원문 판은 `고객사 판`에 `[고객사 회차용]`을 달아 두었다.\n5. **평가표 항목의 번역체** — KW01 \"~에 대한 숙지\", KW04 \"~함에 있어\"는 번역체 조사이지만 피터가 현장에서 쓴 원문이라 고치지 않았다. 다듬으려면 KW01 \"슬라이드 내용을 충분히 숙지하였는가?\", KW04 \"Data를 설명할 때 명확한 근거 (출처, 연도, 정확한 수치)를 언급하는가?\"를 권한다.\n6. **점수 라벨 넷** — 매우 좋음 · 좋음 · 보통 · 아쉬움(영어 병기). '미흡' · '부족' 대신 '아쉬움'을 고른 것은 피드백 화면의 결(평가가 아니라 관점의 공유)에 맞추려는 것이다. ★피터 확인.\n7. **합계 75** — 원본 시트는 /50이다. 앱은 75로 두었다(PRD 0-3의 7번). 50이 맞으면 어느 영역을 빼는지 알려 주시면 `합계` 한 줄과 영역 블록을 고친다.\n8. **점수 모드의 필수** — 켜면 15항목 모두 고르게 했다(평가표 원본이 모든 항목에 점수를 매긴다). 90초 안에 15번 누르기가 빠듯하면 '선택'으로 바꾸고 빈 항목은 평균에서 뺀다. ★기획값.\n9. **캡션의 '다섯'** — 교재 캡션은 \"다섯 항목을\"이다. 평가표 세트는 15항목이라 그 세트만 \"열다섯 항목을\"로 바꿨다. 교재 · 온라인 세트는 원문 그대로다.\n10. **셀프 SF03은 원문 전체** — PRD 7-5는 \"개선할 점은 무엇이었습니까?\"까지만 적었다. 교재 원문 \"개선할 점은 무엇이었습니까? 왜 그렇게 되었습니까?\"를 통째로 옮겼다(원문 인용 규칙).\n11. **피드백하는 법 셋째 · 다섯째 줄** — PRD 7-3의 \"발표자는 자기가 잘한 지점을 모르는 경우가 많습니다\"를 교재 L2448 원문에 가깝게 \"발표자 본인이 잘한 지점을 모르는 경우가 대단히 많습니다\"로, \"부탁한 항목\"을 교재 캡션의 \"요청한 항목\"으로 되돌렸다.\n12. **좋았던 점 예시** — PRD 가안 \"귀가 열렸습니다\"는 은유라 \"끝까지 듣게 됐습니다\"로 바꿨다(피터 글 교훈: 은유어 금지).\n13. **새로 더한 화면 문구 넷** — PRD에 없는 경우를 메우는 한 줄들이다. 쓰던 중 발표자가 바뀔 때(`발표자 바뀜` · `이어 쓰기`), 이미 보낸 발표자에게 다시 쓸 때(`이미 보냄`), 받은 피드백이 있는데 관찰 세트를 바꾸려 할 때(`세트 바꾸기 막음`), 셀프를 나중에 쓸 때(`나중에`). 구성을 늘린 것이 아니라 PRD 7-2 · 7-3의 동작에 문구를 붙인 것이다. 빼려면 해당 줄만 지운다.\n14. **'다음 하나'의 미리 채움** — 셀프 SF06의 답을 리포트 ⑦ '다음 발표에서 적용할 것 하나'에 먼저 넣는다. 같은 질문을 두 번 묻지 않으려는 것이다. 발표자는 동료 피드백을 읽고 바꿀 수 있다.\n15. **결과 카드의 좋았던 점 고르는 규칙** — PRD 7-6 ⑧은 \"좋았던 점 세 줄\"만 정했다. 강사 1줄 + 가장 많이 짚은 항목의 동료 글 2줄, 40자를 넘는 글은 건너뜀으로 정했다(말줄임 없이 카드에 맞추려는 것). ★기획값.\n16. **짝 영역** — 관찰 항목마다 앱 ①의 영역 코드를 내부 기록으로 붙였다. PRD 12-2의 v2 후보(사전 진단 결과와 피드백 연결)를 위한 것이다. 화면에는 나오지 않는다. KW05 질의응답은 RH(예상 질문 준비), ON04 참여 유도는 RH(현장 신호 읽기)로 붙였다.\n17. **카톡 끝 줄** — 앱 ①과 같은 끝 두 줄을 두되, 표시는 회차 설정 '카톡 단추'(기본 끔)를 따르게 했다. 기업 과정 당일 화면이라 기본으로는 보이지 않는다.\n18. **이야기 구조** — B2B 도구 원고라 `story-arc-writing` 서사 설계표를 쓰지 않았다(PRD 4장과 같은 판단). 리포트의 순서(강사 → 좋은 점 먼저 → 남은 한 문장 → 개선할 점 → 다음 하나)만 교재 22의 피드백 순서를 따랐다."}};

 덱에 근거가 없는 숫자다. 파일럿 뒤 조정한다.","spareMd":"> 모두 `상태: 끔`이다. 코치가 과정 성격에 맞춰 콘솔에서 켜고, 같은 영역의 본 문항 하나를 끈다(예: 온라인 과정이면 BO05를 끄고 BO10을 켠다). 원천은 PRD 6-6의 C-1 번호 그대로다.","pairsMd":"### 진단 안의 겹침 쌍 (PRD 6-5)\n\n| 쌍 | 문항 A | 문항 B · C | 가른 기준 |\n|---|---|---|---|\n| KN04 ↔ ST01 ↔ SL02 | 나는 발표 전체가 결국 하려는 말을 한 문장으로 말할 수 있다 | 나는 슬라이드마다 핵심 메시지를 한 문장으로 말할 수 있다 / 나는 슬라이드 제목에 이름표가 아니라 메시지 문장을 쓴다 | 발표 전체 ↔ 말로 하는 장마다 ↔ 화면에 쓰는 글자 |\n| VO01 ↔ VO03 ↔ BO03 | 나는 군더더기 표현 없이 침묵으로 쉴 수 있다 | 나는 접속사 뒤 · 중요한 말 뒤 · 질문 뒤에 3초 이상 멈춘다 / 나는 말이 막히면 시선을 살짝 아래로 두고 잠깐 멈춘다 | 채움말 대신 ↔ 의도한 멈춤 ↔ 막혔을 때의 몸 |\n| RH01 ↔ RH02 ↔ KN01 | 나는 같은 내용을 5분 · 30분 · 1시간으로 조절해 발표할 수 있다 | 나는 시간이 줄면 속도를 올리지 않고 미리 정한 항목부터 뺀다 / 나는 20분 분량으로 설명하던 내 업무를 5분으로 줄여 말할 수 있다 | 연습된 유연성 ↔ 현장의 버릴 순서 ↔ 내용 이해의 시험 |\n| AU02 ↔ AU05 | 나는 청중의 배경 · 성향 · 수준에 대해 10분 이상 설명할 수 있다 | 나는 듣는 사람이 책임지는 것(일정 · 비용 · 품질)을 보고 그 사람의 첫 질문을 예측한다 | 청중을 아는가 ↔ 그 청중이 먼저 물을 것을 아는가 |\n\n### 예비 문항을 켤 때 함께 볼 쌍\n\n| 쌍 | 문항 A | 문항 B · C | 가른 기준 |\n|---|---|---|---|\n| KN07 ↔ KN03 ↔ KN04 | 나는 맡은 일을 \"이래서 → 이렇게 됐고 → 그래서 이걸 하려고 합니다\" 세 마디로 말할 수 있다 | 나는 내용을 늘어놓지 않고 원인과 결과로 이어서 정리한다 / 나는 발표 전체가 결국 하려는 말을 한 문장으로 말할 수 있다 | 말하는 틀 ↔ 정리하는 방식 ↔ 결론 한 문장. 셋을 함께 켜지 않는다 |\n| VO06 ↔ VO03 | 나는 질문을 던지고 2~3초 안에 스스로 답해 버린다 | 나는 접속사 뒤 · 중요한 말 뒤 · 질문 뒤에 3초 이상 멈춘다 | 질문 뒤 한 곳의 역문항 ↔ 세 곳의 정문항. VO06을 켜면 VO03을 끈다 |\n| BO08 ↔ BO02 | 나는 여러 명 앞에서 한 문장에 한 사람을 보고, 다음 문장에서 다른 사람으로 옮긴다 | 나는 청중을 향해 자연스럽게 시선을 유지하며 말한다 | 시선을 옮기는 규칙 ↔ 시선의 방향 |\n| RH06 ↔ RH01 | 나는 말을 마친 뒤 시계를 보기 전에 걸린 시간을 먼저 예측해 본다 | 나는 같은 내용을 5분 · 30분 · 1시간으로 조절해 발표할 수 있다 | 시간 감각의 훈련 ↔ 길이를 조절하는 결과 |\n| ST09 ↔ ST05 | 나는 날짜나 숫자가 들어간 실행 요청으로 발표를 끝낸다 | 나는 발표 마지막에 핵심을 간결하게 요약 · 반복한다 | 상대가 할 일 ↔ 내가 다시 묶는 핵심 |\n| SL09 ↔ SL02 | 나는 복잡한 표를 띄울 때 \"오늘 보실 건 두 번째 줄 하나입니다\"처럼 볼 곳을 말로 짚는다 | 나는 슬라이드 제목에 이름표가 아니라 메시지 문장을 쓴다 | 양식을 못 바꿀 때 말로 ↔ 양식을 바꿀 수 있을 때 글자로 |\n| ME06 ↔ ME03 | 나는 내 영역에서 신뢰를 만드는 요소 하나를 정해 두고 발표에서 쓴다 | 나는 내 발표를 '듣는 사람이 두 번 묻지 않았는가'로 잰다 | 발표 안에서 쓰는 장치 ↔ 발표를 재는 지표 |\n| BO10 ↔ BO05 | 나는 온라인 발표에서 카메라를 눈높이에 두고 웹캠 렌즈를 보며 말한다 | 나는 내 발표를 녹화해 자세 · 표정 · 시선을 점검해 본 적이 있다 | 온라인 과정에서 바꿔 끼우는 짝(PRD 6-6 예시) |","pairs":[{"codes":["KN04","ST01","SL02"],"texts":["나는 발표 전체가 결국 하려는 말을 한 문장으로 말할 수 있다","나는 슬라이드마다 핵심 메시지를 한 문장으로 말할 수 있다","나는 슬라이드 제목에 이름표가 아니라 메시지 문장을 쓴다"],"basis":"발표 전체 ↔ 말로 하는 장마다 ↔ 화면에 쓰는 글자"},{"codes":["VO01","VO03","BO03"],"texts":["나는 군더더기 표현 없이 침묵으로 쉴 수 있다","나는 접속사 뒤 · 중요한 말 뒤 · 질문 뒤에 3초 이상 멈춘다","나는 말이 막히면 시선을 살짝 아래로 두고 잠깐 멈춘다"],"basis":"채움말 대신 ↔ 의도한 멈춤 ↔ 막혔을 때의 몸"},{"codes":["RH01","RH02","KN01"],"texts":["나는 같은 내용을 5분 · 30분 · 1시간으로 조절해 발표할 수 있다","나는 시간이 줄면 속도를 올리지 않고 미리 정한 항목부터 뺀다","나는 20분 분량으로 설명하던 내 업무를 5분으로 줄여 말할 수 있다"],"basis":"연습된 유연성 ↔ 현장의 버릴 순서 ↔ 내용 이해의 시험"},{"codes":["AU02","AU05"],"texts":["나는 청중의 배경 · 성향 · 수준에 대해 10분 이상 설명할 수 있다","나는 듣는 사람이 책임지는 것(일정 · 비용 · 품질)을 보고 그 사람의 첫 질문을 예측한다"],"basis":"청중을 아는가 ↔ 그 청중이 먼저 물을 것을 아는가"},{"codes":["KN07","KN03","KN04"],"texts":["나는 맡은 일을 \"이래서 → 이렇게 됐고 → 그래서 이걸 하려고 합니다\" 세 마디로 말할 수 있다","나는 내용을 늘어놓지 않고 원인과 결과로 이어서 정리한다","나는 발표 전체가 결국 하려는 말을 한 문장으로 말할 수 있다"],"basis":"말하는 틀 ↔ 정리하는 방식 ↔ 결론 한 문장. 셋을 함께 켜지 않는다"},{"codes":["VO06","VO03"],"texts":["나는 질문을 던지고 2~3초 안에 스스로 답해 버린다","나는 접속사 뒤 · 중요한 말 뒤 · 질문 뒤에 3초 이상 멈춘다"],"basis":"질문 뒤 한 곳의 역문항 ↔ 세 곳의 정문항. VO06을 켜면 VO03을 끈다"},{"codes":["BO08","BO02"],"texts":["나는 여러 명 앞에서 한 문장에 한 사람을 보고, 다음 문장에서 다른 사람으로 옮긴다","나는 청중을 향해 자연스럽게 시선을 유지하며 말한다"],"basis":"시선을 옮기는 규칙 ↔ 시선의 방향"},{"codes":["RH06","RH01"],"texts":["나는 말을 마친 뒤 시계를 보기 전에 걸린 시간을 먼저 예측해 본다","나는 같은 내용을 5분 · 30분 · 1시간으로 조절해 발표할 수 있다"],"basis":"시간 감각의 훈련 ↔ 길이를 조절하는 결과"},{"codes":["ST09","ST05"],"texts":["나는 날짜나 숫자가 들어간 실행 요청으로 발표를 끝낸다","나는 발표 마지막에 핵심을 간결하게 요약 · 반복한다"],"basis":"상대가 할 일 ↔ 내가 다시 묶는 핵심"},{"codes":["SL09","SL02"],"texts":["나는 복잡한 표를 띄울 때 \"오늘 보실 건 두 번째 줄 하나입니다\"처럼 볼 곳을 말로 짚는다","나는 슬라이드 제목에 이름표가 아니라 메시지 문장을 쓴다"],"basis":"양식을 못 바꿀 때 말로 ↔ 양식을 바꿀 수 있을 때 글자로"},{"codes":["ME06","ME03"],"texts":["나는 내 영역에서 신뢰를 만드는 요소 하나를 정해 두고 발표에서 쓴다","나는 내 발표를 '듣는 사람이 두 번 묻지 않았는가'로 잰다"],"basis":"발표 안에서 쓰는 장치 ↔ 발표를 재는 지표"},{"codes":["BO10","BO05"],"texts":["나는 온라인 발표에서 카메라를 눈높이에 두고 웹캠 렌즈를 보며 말한
