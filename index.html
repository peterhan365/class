<style>
/* 과정 도구 — 공통 CSS (peter-design-system 토큰 · Pretendard 단일)
   참가자 진단 · 리포트 · 코치 콘솔이 같이 쓴다. 우리 팀 처방전 report.css 의 토큰을 승계했다.
   막대는 색만으로 가르지 않는다 — 판정 글자 · 점수 숫자 · 60/75 기준선을 함께 둔다. */
:root{
  --ink:#122420; --ink-2:#1B382F; --ink-soft:#24332C; --gray:#5E6A64; --line:#E2EBE4; --paper:#F4F7F4; --card:#fff;
  --green:#1F9E43; --green-dk:#157A34; --lime:#7CB342; --teal:#2C8C86; --blue:#2E6E9E;
  --plate:#EAF2EC; --lv2:#DDF0E2; --lv3:#BCE3C6;
  --weak:#122420; --mid:#2C8C86; --strong:#1F9E43;
  --warn-bg:#FFF6E0; --warn-bd:#F0DFAE; --warn-fg:#6A5312; --err-bg:#FDECEC; --err-bd:#F2C4C4; --err-fg:#8A1F1F;
  --r-sm:12px; --r-md:18px; --r-lg:26px; --pill:50px;
  --shadow-sm:0 2px 10px rgba(18,36,32,.06); --shadow-md:0 8px 30px rgba(18,36,32,.09); --shadow-lg:0 18px 50px rgba(18,36,32,.14);
  --grad:linear-gradient(120deg,#1F9E43,#2C8C86,#2E6E9E);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink-soft);background:var(--paper);line-height:1.65;font-size:16px;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{color:var(--ink);margin:0;line-height:1.3;letter-spacing:-.02em}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 단추 — 알약형 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.7rem 1.3rem;border-radius:var(--pill);
  border:1px solid transparent;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;line-height:1.3;background:none;
  transition:transform .18s var(--ease),background .18s,border-color .18s,box-shadow .18s,color .18s}
.btn-primary{background:var(--green-dk);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,158,67,.28)}
.btn-line{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn-line:hover{border-color:var(--green);color:var(--green-dk);transform:translateY(-2px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-kakao{background:#FEE500;color:#191919}
.btn-danger{background:var(--card);color:var(--err-fg);border-color:var(--err-bd)}
.btn-sm{min-height:40px;padding:.35rem .95rem;font-size:14px}
.btn-xs{min-height:34px;padding:.2rem .7rem;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn .arrow{transition:transform .2s var(--ease)}
.btn:hover .arrow{transform:translateX(3px)}
.eyebrow{display:inline-flex;align-items:center;gap:.45rem;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-dk)}
.eyebrow .mark{width:15px;height:15px;background:var(--mark) center/contain no-repeat;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;
  background:var(--ink);color:#fff;border-radius:var(--pill);padding:.7rem 1.2rem;font-size:14.5px;font-weight:600;box-shadow:var(--shadow-lg);
  transition:opacity .25s,transform .25s var(--ease);max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-fg);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;line-height:1.6}
.errbox{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-fg);border-radius:var(--r-sm);padding:12px 15px;font-size:14.5px;line-height:1.6}

/* ── 리포트 ─────────────────────────────────────────── */
.rp{max-width:760px;margin:0 auto;padding:0 18px 48px}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.rp-logo{display:block;width:112px;height:52px;background:var(--logo) left center/contain no-repeat;flex:0 0 auto}
.rp-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.rp-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.rp-head{padding:20px 0 6px}
.rp-meta{font-size:13.5px;color:var(--gray);font-weight:600;margin:0 0 10px}
.rp-head h1{font-size:clamp(24px,6.4vw,32px);font-weight:800;letter-spacing:-.035em;line-height:1.32}
.rp-head h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rp-note{font-size:14px;color:var(--gray);margin-top:10px}
.rp-sec{margin-top:34px}
.rp-sh{margin:0 0 14px}
.rp-sh .eyebrow{margin-bottom:6px}
.rp-sh h2{font-size:clamp(21px,5.4vw,26px);font-weight:800;letter-spacing:-.03em}
.rp-sh p{font-size:14.5px;color:var(--gray);margin-top:6px;line-height:1.6}
.rp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:20px}
.rp-card + .rp-card{margin-top:12px}
.rp-callout{background:var(--plate);border-radius:var(--r-sm);padding:14px 16px;font-size:15px;line-height:1.65;color:var(--ink-soft)}
.rp-callout b{color:var(--ink)}
.rp-quote{font-size:15px;color:var(--ink);font-weight:600;border-left:3px solid var(--green);padding:2px 0 2px 12px;margin:0 0 10px}

/* ① 한눈에 — 다크 카드(결과 카드와 같은 구성) */
.rp-glance{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:24px 22px 22px;color:#fff;
  background:linear-gradient(150deg,var(--ink),var(--ink-2));box-shadow:var(--shadow-md)}
.rp-glance::before{content:"";position:absolute;width:360px;height:360px;top:-170px;right:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,158,67,.45),transparent 65%);pointer-events:none}
.rp-glance::after{content:"";position:absolute;width:300px;height:300px;bottom:-170px;left:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,110,158,.35),transparent 65%);pointer-events:none}
.rp-glance > *{position:relative}
.rp-g-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.rp-g-stage{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.rp-g-stage small{display:block;font-size:15px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.78);margin-top:8px}
.rp-steps{display:flex;align-items:flex-end;gap:5px;height:52px}
.rp-steps span{width:18px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.18)}
.rp-steps span.on{background:#8FD9A2}
.rp-g-label{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9FE0B0;margin:20px 0 8px}
.rp-g-bars{display:grid;gap:8px}
.rp-g-bar{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:10px;font-size:14px;font-weight:700}
.rp-g-bar .tr{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.rp-g-bar .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4CC46C,#8FD9A2)}
.rp-g-bar b{text-align:right}
.rp-g-chips{display:flex;flex-wrap:wrap;gap:8px}
.rp-g-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:var(--pill);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);font-size:14.5px;font-weight:700;backdrop-filter:blur(6px)}
.rp-g-chip em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.rp-g-chip.str{background:rgba(124,179,66,.18);border-color:rgba(159,224,176,.45)}

/* ② 숙지 사다리 */
.rp-ladder svg{display:block;width:100%;height:auto;max-height:170px}
.rp-ladder .st{fill:var(--lv2)}
.rp-ladder .st.on{fill:var(--green)}
.rp-ladder .st.past{fill:var(--lv3)}
.rp-ladder text{font-family:var(--font);font-weight:800;font-size:22px;fill:var(--ink)}
.rp-ladder text.on{fill:#fff}
.rp-ladder .mk{fill:var(--ink)}
.rp-stlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.rp-stlist li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card)}
.rp-stlist li .n{width:30px;height:30px;border-radius:9px;background:var(--paper);color:var(--gray);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.rp-stlist li b{display:block;color:var(--ink);font-size:15px}
.rp-stlist li span{display:block;font-size:14px;color:var(--gray);line-height:1.55;margin-top:2px}
.rp-stlist li.on{border-color:var(--green);background:var(--plate);box-shadow:0 0 0 2px rgba(31,158,67,.15)}
.rp-stlist li.on .n{background:var(--green-dk);color:#fff}
.rp-stlist .next{grid-column:1 / -1;margin-top:6px;padding:11px 13px;border-radius:10px;background:var(--card);border:1px dashed var(--green);font-size:14.5px;color:var(--ink-soft);line-height:1.6}

/* ③ 세 층 · ⑦ 전체 막대 */
.rp-bars{display:grid;gap:12px}
.rp-bar{display:grid;grid-template-columns:minmax(78px,30%) 1fr 64px;align-items:center;gap:10px}
.rp-bar .lb{font-weight:700;color:var(--ink);font-size:15px;line-height:1.35}
.rp-bar .lb small{display:block;font-weight:500;color:var(--gray);font-size:12.5px;letter-spacing:.02em}
.rp-bar .sc{text-align:right;font-weight:800;color:var(--ink);font-size:15px;white-space:nowrap}
.rp-bar .sc small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gray)}
.rp-track{position:relative;height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
.rp-track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--green)}
.rp-track i.weak{background:var(--weak)}
.rp-track i.mid{background:var(--mid)}
.rp-track i.strong{background:var(--strong)}
.rp-track .ln{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed rgba(18,36,32,.45)}
.rp-track .ln.s{border-left-style:solid;border-left-color:rgba(18,36,32,.6)}
.rp-track .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;border:2px solid var(--ink);opacity:.85}
.rp-bar .ds{grid-column:1 / -1;font-size:13px;color:var(--gray);margin:0;line-height:1.5}
.rp-stack .rp-bar{padding:12px 14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.rp-stack .rp-bar.low{border-color:var(--ink);box-shadow:0 0 0 2px rgba(18,36,32,.12)}
.rp-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--gray);margin:0 0 12px}
.rp-legend span{display:inline-flex;align-items:center;gap:6px}
.rp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rp-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.rp-pill.weak{background:var(--weak);color:#fff}
.rp-pill.mid{background:#DCEFEE;color:#1D5E5A}
.rp-pill.strong{background:var(--lv2);color:var(--green-dk)}
.rp-all details{border-bottom:1px solid var(--line)}
.rp-all details:last-child{border-bottom:0}
.rp-all summary{list-style:none;cursor:pointer;padding:12px 2px}
.rp-all summary::-webkit-details-marker{display:none}
.rp-all .rp-bar .lb{display:flex;align-items:center;gap:6px}
.rp-all .rp-bar .lb .chev{width:16px;height:16px;flex:0 0 auto;transition:transform .2s}
.rp-all details[open] .chev{transform:rotate(90deg)}
.rp-items{list-style:none;margin:0 0 12px;padding:0 0 0 4px;display:grid;gap:8px}
.rp-items li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;color:var(--ink-soft);line-height:1.5}
.rp-dots{display:inline-flex;gap:3px}
.rp-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.rp-dots i.on{background:var(--green-dk)}
.rp-dots.low i.on{background:var(--ink)}

/* ④ ⑤ 영역 카드 */
.rp-dc{position:relative}
.rp-dc .hq{font-size:13px;color:var(--gray);font-weight:600;margin:0 0 4px}
.rp-dc h3{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rp-dc h3 .rk{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 auto}
.rp-dc .line{font-size:14.5px;color:var(--gray);margin:6px 0 12px}
.rp-dc .vt{font-size:15px;line-height:1.7;color:var(--ink-soft);margin:12px 0 0}
.rp-dc .score{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.rp-dc .score .rp-track{flex:1 1 auto}
.rp-dc .score b{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap}
.rp-blk{margin-top:16px}
.rp-blk h4{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-dk);margin:0 0 7px}
.rp-blk p{font-size:15px;line-height:1.7}
.rp-blk .sub{font-size:13px;color:var(--gray);margin:-2px 0 8px}
.rp-low{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rp-low li{padding:11px 13px;border-radius:var(--r-sm);background:var(--paper);font-size:14.5px;line-height:1.6}
.rp-low li b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.rp-rx{padding:14px 16px;border-radius:var(--r-sm);background:var(--plate);font-size:15px;line-height:1.75;color:var(--ink)}
.rp-pick{display:block;width:100%;text-align:left;padding:14px 16px 14px 48px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);
  cursor:pointer;position:relative;font-size:15px;line-height:1.7;color:var(--ink-soft);transition:border-color .15s,box-shadow .15s,background .15s}
.rp-pick::before{content:"";position:absolute;left:15px;top:16px;width:20px;height:20px;border-radius:50%;border:2px solid var(--lv3);background:var(--card)}
.rp-pick b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}
.rp-pick:hover{border-color:var(--green)}
.rp-pick[aria-pressed="true"]{border-color:var(--green);background:var(--plate);box-shadow:0 0 0 2px rgba(31,158,67,.18)}
.rp-pick[aria-pressed="true"]::before{border-color:var(--green-dk);background:var(--green-dk);box-shadow:inset 0 0 0 4px var(--plate)}
.rp-pick.static{cursor:default;padding-left:16px}.rp-pick.static::before{display:none}
.rp-rec{display:grid;gap:6px;font-size:14px;line-height:1.6}
.rp-rec div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.rp-rec span{font-size:12px;font-weight:700;color:var(--gray);letter-spacing:.06em;padding-top:2px}
.rp-third{font-size:14px;color:var(--gray);margin:16px 2px 8px;font-weight:600}
.rp-str{border-left:4px solid var(--green)}
.rp-str .badge{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--green-dk);background:var(--lv2);border-radius:var(--pill);padding:3px 9px;margin-bottom:8px}

/* ⑧ 다음 한 걸음 */
.rp-next{border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-md);padding:22px 20px}
.rp-chosen{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:var(--r-sm);background:var(--plate);margin:4px 0 14px}
.rp-chosen i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--green-dk);margin-top:1px;position:relative}
.rp-chosen i::after{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.rp-chosen b{display:block;font-size:17px;color:var(--ink);line-height:1.45}
.rp-chosen span{display:block;font-size:13px;color:var(--gray);margin-top:3px}
.rp-actions{display:grid;gap:9px}
.rp-actions .btn{width:100%}
.rp-status{font-size:13.5px;color:var(--gray);margin-top:12px;text-align:center;min-height:1.2em}
.rp-preview{margin:16px auto 0;max-width:280px}
.rp-preview img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow-md);border:1px solid var(--line)}
.rp-foot{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--gray);line-height:1.7;text-align:center}
.rp-foot .rp-logo{margin:0 auto 10px;background-position:center}
.rp-foot b{color:var(--ink-soft)}
.rp-foot a{color:var(--green-dk);font-weight:700}
@media (min-width:720px){
  .rp-actions{grid-template-columns:1fr 1fr}
  .rp-actions .btn-primary{grid-column:1 / -1}
  .rp-glance{padding:30px 32px 28px}
  .rp-g-row{display:grid;grid-template-columns:1fr 1fr;gap:26px}
}
@media (max-width:560px){
  .rp-bar{grid-template-columns:1fr auto;row-gap:7px}
  .rp-bar .lb{grid-column:1;grid-row:1}
  .rp-bar .sc{grid-column:2;grid-row:1;display:flex;align-items:baseline;gap:6px}
  .rp-bar .sc small{display:inline}
  .rp-bar > .rp-track{grid-column:1 / -1;grid-row:2}
  .rp-bar .ds{grid-row:3}
  .rp-all .rp-bar .lb small{display:inline;margin-left:4px}
}
@media print{
  body{background:#fff}
  .rp-actions,.rp-preview,.toast,.no-print{display:none!important}
  .rp-card,.rp-next{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

*{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
.a-screen{display:none}
.a-screen.a-on{display:block}
.a-fade{animation:aIn .22s var(--ease)}
@keyframes aIn{from{opacity:0;transform:translateX(14px)}}
.a-logo{display:block;width:150px;height:72px;margin:0 auto;background:var(--logo) center/contain no-repeat}
.a-hero{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px 26px;max-width:620px;margin:0 auto}
.a-hero .eyebrow{margin-top:18px}
.a-hero h1{font-size:clamp(27px,7.6vw,38px);margin:12px 0 10px;letter-spacing:-.035em;font-weight:800;line-height:1.28}
.a-hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.a-sub{font-size:16px;color:var(--gray);margin:0 0 16px;line-height:1.65}
.a-meta{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem .6rem;background:var(--card);border:1px solid var(--line);border-radius:var(--pill);
  padding:.45rem 1rem;font-size:13.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm);margin:0 0 6px}
.a-meta i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.a-meta small{font-weight:600;color:var(--gray)}
.a-guide{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:16px 18px;text-align:left;
  font-size:15px;line-height:1.7;margin:14px 0 16px;width:100%}
.a-guide p + p{margin-top:.5em}
.a-guide .a-small{font-size:13px;color:var(--gray)}
.a-guide b{color:var(--ink)}
.a-fields{display:grid;gap:10px;width:100%;margin:0 0 14px;text-align:left}
.a-field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 5px}
.a-field label small{font-weight:600;color:var(--gray)}
.a-in{width:100%;height:50px;padding:0 15px;font-size:16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink)}
.a-in:focus,.a-area:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,158,67,.16)}
.a-actions{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.a-actions .btn{width:100%;min-height:54px;font-size:16.5px}
.a-resume{font-size:14.5px;color:var(--ink-soft);margin:0 0 8px;font-weight:600}
.a-tool{font-size:12.5px;color:var(--gray);margin-top:18px}

/* 문항 */
#s-q.a-on{display:flex;flex-direction:column;min-height:100dvh}
.a-prog{height:6px;background:var(--line);flex:0 0 auto}
.a-prog i{display:block;height:100%;width:0;background:var(--green);border-radius:0 3px 3px 0;transition:width .3s var(--ease)}
.a-qtop{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:4px 12px;max-width:640px;margin:0 auto;width:100%}
.a-ghost{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:.4rem .6rem;background:none;border:0;color:var(--gray);font-size:15px;font-weight:600;cursor:pointer;border-radius:var(--pill)}
.a-ghost:hover{color:var(--green-dk)}
.a-where{font-size:13px;font-weight:700;color:var(--gray);letter-spacing:.04em;white-space:nowrap}
.a-qbody{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:6px 20px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;width:100%}
.a-qtag{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:700;color:var(--green-dk);margin-bottom:10px;line-height:1.5}
.a-qtag b{flex:0 0 auto;background:var(--lv2);border-radius:6px;padding:1px 7px;font-size:12px;letter-spacing:.06em}
.a-qtext{font-size:clamp(20px,5.6vw,25px);font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.42;margin:0 0 8px}
.a-qsub{font-size:14.5px;color:var(--gray);margin:0 0 6px;line-height:1.6}
.a-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.a-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:11px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);box-shadow:var(--shadow-sm);font-size:16.5px;font-weight:600;color:var(--ink-soft);text-align:left;cursor:pointer;line-height:1.4;
  transition:border-color .15s,box-shadow .15s,background .15s}
.a-opt .a-num{flex:0 0 28px;height:28px;border-radius:8px;background:var(--paper);color:var(--gray);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.a-opt:hover{border-color:var(--lv3)}
.a-opt[aria-pressed="true"]{border-color:var(--green);background:var(--plate);box-shadow:0 0 0 2px rgba(31,158,67,.2)}
.a-opt[aria-pressed="true"] .a-num{background:var(--green-dk);color:#fff}
.a-yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.a-yn .a-opt{justify-content:center;font-size:18px;font-weight:700;min-height:64px}
.a-hint{font-size:12.5px;color:var(--gray);margin-top:16px;text-align:center;line-height:1.6}
.a-mid{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:36px 20px;max-width:640px;margin:0 auto}
.a-mid h2{font-size:clamp(21px,5.6vw,25px);margin:8px 0 8px;letter-spacing:-.025em;line-height:1.42}
.a-mid .a-qsub{margin-bottom:14px}
.a-area{width:100%;min-height:120px;padding:13px 15px;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:16px;line-height:1.6;resize:vertical}
.a-row{display:flex;gap:10px;flex-wrap:wrap}
.a-row .btn{flex:1 1 160px;min-height:54px}
.a-msg{text-align:center}
.a-msg p{font-size:16px;line-height:1.7;margin:16px 0 22px}
@media (hover:none){.a-kbd{display:none}}
</style>
</head>
<body>
<main id="app">
  <!-- 시작 -->
  <section class="a-screen a-on" id="s-start" aria-labelledby="st-h">
    <div class="a-hero">
      <span class="a-logo" role="img" id="st-logo"></span>
      <span class="eyebrow" id="st-course"><span class="mark"></span><span></span></span>
      <h1 id="st-h"></h1>
      <p class="a-sub" id="st-sub"></p>
      <p class="a-meta"><i></i><span id="st-dur"></span><small id="st-dur2"></small></p>
      <div class="a-guide" id="st-guide"></div>
      <div class="a-fields" id="st-fields" hidden>
        <div class="a-field" id="st-f-name"><label for="in-name"></label><input class="a-in" id="in-name" maxlength="40" autocomplete="name"></div>
        <div class="a-field" id="st-f-org"><label for="in-org"></label><input class="a-in" id="in-org" maxlength="60" autocomplete="organization"></div>
      </div>
      <div class="a-actions">
        <p class="a-resume" id="st-resume" hidden></p>
        <button type="button" class="btn btn-primary" id="bt-start"></button>
        <button type="button" class="btn btn-line" id="bt-restart" hidden></button>
      </div>
      <p class="a-tool" id="st-tool"></p>
    </div>
  </section>

  <!-- 문항 (시작 질문 · 사다리 · 본 문항 공용) -->
  <section class="a-screen" id="s-q" aria-live="polite">
    <div class="a-prog" aria-hidden="true"><i id="q-bar"></i></div>
    <div class="a-qtop">
      <button type="button" class="a-ghost" id="bt-back"><span aria-hidden="true">←</span> <span id="bt-back-t"></span></button>
      <span class="a-where num" id="q-where"></span>
    </div>
    <div class="a-qbody a-fade" id="q-body">
      <p class="a-qtag" id="q-tag"></p>
      <h2 class="a-qtext" id="q-text"></h2>
      <p class="a-qsub" id="q-sub"></p>
      <div id="q-opts"></div>
      <p class="a-hint" id="q-hint"></p>
    </div>
  </section>

  <!-- 주관식 -->
  <section class="a-screen" id="s-open">
    <div class="a-prog" aria-hidden="true"><i style="width:100%"></i></div>
    <div class="a-qtop">
      <button type="button" class="a-ghost" id="bt-back2"><span aria-hidden="true">←</span> <span id="bt-back2-t"></span></button>
      <span class="a-where num" id="o-where"></span>
    </div>
    <div class="a-mid" style="min-height:auto;padding-top:10px" id="o-body"></div>
  </section>

  <!-- 안내 · 오류 -->
  <section class="a-screen" id="s-msg">
    <div class="a-mid a-msg"><span class="a-logo" role="img"></span><p id="m-text"></p><div class="a-actions" style="margin:0 auto" id="m-actions"></div></div>
  </section>

  <!-- 리포트 -->
  <section class="a-screen" id="s-report"><div id="report-root"></div></section>
</main>
<canvas id="card-canvas" width="1080" height="1350" hidden></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* 과정 도구 엔진 — 채점 · 판정 · 우선순위 · 숙지 단계 · 집계 · 결과 카드 문구 · 템플릿 검사 · 버전 · 원고 내보내기
   기준: work/01_기획/20261018_PT진단피드백앱_PRD.md 5장(공통 엔진) · 6-7(채점 · 판정 · 우선순위) · 6-9(콘솔) · 8-3(시트 탭)
   브라우저(window.ClassEngine) · 코치 콘솔 · Apps Script(Code.gs 에 그대로 붙는다) · node(require) 넷이 이 파일 하나를 쓴다.

   약속
   - 이 파일은 과정 이름을 모른다. 영역 · 문항 · 판정 이름 · 문구는 모두 템플릿 데이터에서 온다.
   - 같은 응답이면 늘 같은 결과(결정성). 같은 점수는 아래 층 → 영역 순서가 앞인 쪽이 먼저다.
   - 응답은 '템플릿@버전'에 묶인다. 게시된 버전은 잠겨서 고칠 수 없다(고치려면 다음 버전). 옛 응답의 리포트는 바뀌지 않는다.

  if (typeof module === 'object' && module.exports) module.exports = factory();

  'use strict';

    { name: '\uC790\uB9AC', rx: new RegExp('\uC790\uB9AC') },

    '\uB7A8\uB9AC\uC11C\uCE58', '\uD074\uB9AC\uC624', '\uCEA0\uD0DD', '\uCF00\uC5B4\uB9C1', '\u0044ISC', '\u004DBTI'

  /* ── 템플릿 읽기 ──────────────────────────────────────── */
  function ref(tpl) { return tpl.id + '@v' + tpl.version; }
  function scaleMin(tpl) { return Math.min.apply(null, tpl.scale.points.map(function (p) { return Number(p.v); })); }

  function onItems(d) { return d.items.filter(function (it) { return it.on; }); }
  function sequence(tpl) {                    // 응답 순서 — 영역 순서대로 켠 문항
    var a = [];
    tpl.domains.forEach(function (d) { onItems(d).forEach(function (it) { a.push({ code: it.code, domain: d.code, rev: !!it.rev, text: it.text }); }); });
    return a;
  }
  function domainOf(tpl, code) { for (var i = 0; i < tpl.domains.length; i++) if (tpl.domains[i].code === code) return tpl.domains[i]; return null; }
  function itemOf(tpl, code) {
    for (var i = 0; i < tpl.domains.length; i++) for (var j = 0; j < tpl.domains[i].items.length; j++) if (tpl.domains[i].items[j].code === code) return tpl.domains[i].items[j];
    return null;
  }
  function layerOf(tpl, d) {
    var ls = tpl.layers || [];
    for (var i = 0; i < ls.length; i++) if (ls[i].name === d.layer) return ls[i];

  }
  /** 층 순위 — 쌓는 순서 1(아래)부터. 순서 0(층 밖 · 출발점)과 층이 없는 영역은 맨 뒤 */
  function layerRank(tpl, d) { var l = layerOf(tpl, d); return l && Number(l.order) >= 1 ? Number(l.order) : 99; }
  function stackLayers(tpl) {
    return sortStable((tpl.layers || []).filter(function (l) { return Number(l.order) >= 1; }), function (a, b) { return Number(a.order) - Number(b.order); });
  }

  }

  /* ── 점수 ─────────────────────────────────────────────── */
  function scored(tpl, v, rev) {
    var n = Number(v), lo = scaleMin(tpl), hi = scaleMax(tpl);
    if (v === null || v === undefined || v === '' || !isFinite(n) || n !== Math.round(n) || n < lo || n > hi) return null;

  /** 표시 점수 — 정수로 반올림하되, 판정선 바로 아래 값이 선 위로 올라가 보이지 않게 한다 (59.6 → 59) */
  function disp(tpl, v) {

  }

  /**
   * 개인 결과. resp = { ans:{코드:1~최대}, choice:1~n, ladder:{LV1:true|false}, open:{OP1:''} }
   * opt = { priority:{...} } — 템플릿 값을 덮을 때만(시험용). 운영에서는 템플릿에 박힌 값만 쓴다.

        .slice(0, lowShow).map(function (x) { return x.code; });
      var layer = layerOf(tpl, d);
      return { code: d.code, raw: raw, score: disp(tpl, raw), verdict: verdictOf(tpl, raw), layer: d.layer || '', rank: layerRank(tpl, d),

    });
    var complete = !missing.length;
    // 층 — 그 층 영역 점수의 평균. 층 밖(순서 0)은 막대에 넣지 않는다

      var m = ds.length ? r6(ds.reduce(function (a, d) { return a + d.raw; }, 0) / ds.length) : null;

    tpl.domains.forEach(function (d, i) { order[d.code] = Number(d.order) || i + 1; });
    var ranked = sortStable(doms.filter(function (d) { return d.pr !== null; }), function (a, b) {
      if (Math.abs(a.pr - b.pr) > EPS) return b.pr - a.pr;

      return order[a.code] - order[b.code];
    });

      next = lo[0].code;

:"고민 유형","q":"지금 발표 고민에 가장 가까운 것은 무엇입니까?","guide":"하나만 고르십시오. 점수에는 들어가지 않습니다.","options":[{"label":"혼자 연습할 때는 괜찮은데 사람 앞에서만 막힌다","chapter":"3장 「무대 울렁증은 특별한 병이 아닙니다」","result":"사람 앞에서만 막힌다면 평가가 무서운 것뿐입니다. 먼저 3장 「무대 울렁증은 특별한 병이 아닙니다」를 보십시오."},{"label":"발표는 하는데 끝나면 녹초가 된다","chapter":"4부 「전문가의 무기」(13~15장)","result":"끝나면 녹초가 된다면, 그건 결함이 아니라 특성입니다. 먼저 4부 「전문가의 무기」(13~15장)를 보십시오."},{"label":"아는 건 많은데 정리가 안 돼서 말이 길어진다","chapter":"2부 「말발보다 먼저인 것」 · 3부 「여기부터가 도구입니다」","result":"아는 건 많은데 길어진다면 순서 문제입니다. 먼저 2부와 3부를 보십시오."},{"label":"말은 나오는데 결론이 남지 않는다","chapter":"4장 「외향형은 모두 발표를 잘할까?」","result":"말은 나오는데 결론이 남지 않는다면 고민은 다른 곳에 있습니다. 먼저 4장 「외향형은 모두 발표를 잘할까?」를 보십시오."},{"label":"딱 하나를 고르기 어렵다","chapter":"(없음)","result":"고민이 하나로 모이지 않아도 괜찮습니다. 아래 '먼저 손댈 영역'부터 보십시오."}],"use":"점수 · 우선순위에 쓰지 않는다. 리포트 ⑥과 콘솔 회차 분포에만 쓴다"},"ladder":{"code":"LV","title":"숙지 사다리","guide":"지금 맡고 있는 업무(또는 다음 발표 내용) 하나를 떠올리고 답해 주십시오.","yes":"예","no":"아니요","items":[{"code":"LV1","text":"나는 그 내용을 자료 없이 설명할 수 있다"},{"code":"LV2","text":"나는 질문이 들어와도 답하고 원래 흐름으로 돌아올 수 있다"},{"code":"LV3","text":"나는 순서를 바꿔서, 길이를 바꿔서 말할 수 있다"}],"rule":"숙지 단계 = 1 + LV1부터 연속으로 '예'인 개수 (1~4). 중간에 '아니요'가 있으면 그 뒤의 '예'는 단계에 넣지 않는다","skip":[{"code":"LV1","text":"질문에 답하거나 순서를 바꿔 말할 수는 있다고 답하셨는데, 자료 없이 설명하기는 어렵다고 답하셨습니다. 단계는 1단계부터 이어진 '예'까지만 셉니다. 자료를 덮고 처음부터 한 번 말해 보는 것부터 시작하십시오."},{"code":"LV2","text":"순서와 길이는 바꿀 수 있다고 답하셨는데, 질문이 들어오면 흐름으로 돌아오기 어렵다고 답하셨습니다. 단계는 이어진 '예'까지만 셉니다. 먼저 3단계, 질문에 답하고 돌아오는 연습부터 하십시오."}]},"stages":{"head":"\"내용을 안다\"는 말은 너무 두루뭉술합니다. 네 단계로 나눠 보겠습니다.","common":"대부분의 발표 준비는 2단계에서 끝납니다. 외우고 나면 준비가 끝났다고 느끼기 때문입니다. 그런데 실전은 3단계와 4단계에서 갈립니다.","cardLabel":"숙지 {n}단계","list":[{"n":1,"title":"자료를 보면서","name":"자료를 보면서 설명한다","origin":"1단계는 자료를 보면서 설명할 수 있는 것입니다. 화면을 계속 보고 시선이 청중에게 못 갑니다.","report":"지금은 1단계입니다. 자료가 있어야 설명이 이어지는 상태입니다. 누구나 여기서 출발합니다.","next":"2단계로 가려면 자료를 덮고 처음부터 끝까지 한 번 말해 보십시오. 막히는 곳이 아직 내 말이 되지 않은 곳입니다."},{"n":2,"title":"자료 없이","name":"자료 없이 설명한다","origin":"2단계는 자료 없이 설명할 수 있는 것입니다. 말은 나오는데 준비한 순서대로만 나옵니다.","report":"지금  무엇으로 확인할지가 정해지면 준비할 것이 보입니다.","spare":true},{"code":"AU09","short":"입구 바꾸기","text":"나는 같은 내용이라도 청중에 따라 말을 시작하는 지점을 바꾼다","rev":false,"on":false,"low":"누구 앞에서든 같은 지점에서 말을 시작하고 있을 수 있습니다. 상대가 궁금해하는 곳에서 시작하면 같은 자료가 다르게 들립니다.","spare":true}]},{"code":"KN","order":3,"name":"내용 숙지","layer":"기반","head":"20분짜리 설명을 5분으로 줄일 수 있는가?","line":"내 업무를 원인과 결과로 꿰어 한 문장으로, 5분으로 말할 수 있다","verdict":{"weak":"아직 손이 덜 간 영역입니다. 아는 것은 많은데 정리가 덜 되어 말이 길어지고 있을 수 있습니다. 말이 길어지는 것은 말하기 기술보다 핵심이 아직 잡히지 않았다는 신호인 경우가 많아, 이 영역을 먼저 다루시기를 권합니다.","mid":"내용은 알지만 준비한 순서대로만 꺼낼 수 있는 상태일 수 있습니다. 스스로 질문을 던져 막히는 곳을 찾으면 한 단계 올라갑니다.","strong":"내용을 꿰고 있어 간결하게 말할 수 있는 상태입니다. 충분히 아는 사람은 간결하게 말합니다. 시간이 줄어도 흔들리지 않는 바탕이 여기 있습니다."},"rx":"하나, 먼저 전부 늘어놓습니다. 둘, 인과로 꿰맵니다. 체인에 안 걸리는 항목은 안 넣어도 되는 항목입니다. 셋, 체인에서 한 문장을 뽑습니다. 그게 원메시지입니다.","practice":"\"이래서 → 이렇게 됐고 → 그래서 이걸 하려고 합니다.\" 조건도 예외도 붙이지 마십시오. 세 마디가 안 되면 첫 마디만 적으십시오. \"이래서\"까지만 나와도 체인의 첫 고리는 걸린 겁니다. 그리고 다음 회의에서 그 세 마디를 먼저 말하십시오.","practiceShort":"맡은 일을 세 마디로 적고, 회의에서 먼저 말한다","rec":{"text":"INTRO · AI가 자료는 만들어주지만, 사람을 움직이는 건 결국 당신의 설득력입니다","lecture":"5장 「말 잘하는 네 번째 부류」 · 6장 「기술 전문가를 두고 왜 제가 발표했을까요」 · 7장 「수준이 높아지면 말도 간결해집니다」","book":"『다 말하지 마세요』 2부(5 · 6 · 7장) [기업 회차 끔]"},"items":[{"code":"KN01","short":"5분으로 줄이기","text":"나는 20분 분량으로 설명하던 내 업무를 5분으로 줄여 말할 수 있다","rev":false,"on":true,"low":"줄여 보라고 하면 \"다 필요한 내용\"이라는 생각부터 들 수 있습니다. 못 줄이는 것은 시간이 부족해서라기보다 인과관계의 정리가 아직 덜 되었다는 신호입니다.","spare":false},{"code":"KN02","short":"스스로 묻기","text":"나는 발표 전에 \"왜 하필 이 방법인가\", \"안 되면 어떻게 되나\"를 스스로 묻는다","rev":false,"on":true,"low":"준비가 외우기에서 끝나고 있을 수 있습니다. 스스로 던진 질문에서 막히는 곳이 아직 설익은 곳입니다.","spare":false},{"code":"KN03","short":"원인과 결과로","text":"나는 내용을 늘어놓지 않고 원인과 결과로 이어서 정리한다","rev":false,"on":true,"low":"항목을 첫째, 둘째로 늘어놓고 있을 수 있습니다. 틀린 것은 없어도 듣는 사람은 왜 그 일을 했는지 모른 채 남습니다.","spare":false},{"code":"KN04","short":"한 문장","text":"나는 발표 전체가 결국 하려는 말을 한 문장으로 말할 수 있다","rev":false,"on":true,"low":"발표 전체가 결국 하려는 말이 한 문장으로 모이지 않을 수 있습니다. 한 문장이 뽑히면 5분 버전도 20분 버전도 만들 수 있습니다.","spare":false},{"code":"KN05","short":"빠뜨림 공포","text":"나는 빼면 부실해 보일까 봐 아는 것을 최대한 다 넣는다","rev":true,"on":true,"low":"빼면 부실해 보일까 봐 아는 것을 모두 담고 있을 수 있습니다. 원인과 결과로 이어 보면 빼도 되는 항목을 감이 아니라 구조가 알려 줍니다.","spare":false},{"code":"KN06","short":"이어지지 않는 항목 빼기","text":"나는 원인과 결과로 이어지지 않는 항목은 내가 한 일이라도 발표에서 뺀다","rev":false,"on":false,"low":"내가 한 일이라는 이유로 흐름에 걸리지 않는 항목까지 넣고 있을 수 있습니다. 한 일은 맞지만 이 발표에서는 빼도 되는 항목이 있습니다.","spare":true},{"code":"KN07","short":"세 마디","text":"나는 맡은 일을 \"이래서 → 이렇게 됐고 → 그래서 이걸 하려고 합니다\" 세 마디로 말할 수 있다","rev":false,"on":false,"low":"맡은 일을 설명하려면 배경부터 길게 꺼내야 할 수 있습니다. 세 마디가 만들어지면 그 일은 머릿속에서 이미 정리된 것입니다.","spare":true},{"code":"KN08","short":"비유로 번역","text":"나는 전문 개념을 \"쉽게 말하면, ○○ 같은 겁니다\"처럼 분야 밖의 비유로 바꿔 설명할 수 있다","rev":false,"on":false,"low":"전문 개념을 같은 분야의 말로만 설명하고 있을 수 있습니다. 비유가 안 떠오르면 집 안에 있는 물건 가운데서 고르면 됩니다.","spare":true},{"code":"KN09","short":"자주 받는 질문의 한 줄 답","text":"나는 사람들이 나에게 자주 묻는 질문에 바로 쓸 한 줄 답을 정리해 두었다","rev":false,"on":false,"low":"자주 받는 질문에도 매번 새로 답을 만들고 있을 수 있습니다. 한 줄 답이 정리되어 있으면 말이 짧아집니다.","spare":true}]},{"code":"ST","order":4,"name":"내용 구성","layer":"순서","head":"내용에 설득력, 일관성이 있는가?","line":"장마다 메시지 하나, 장 사이에 연결어, 결론 뒤에 조건을 놓는다","verdict":{"weak":"아직 손이 덜 간 영역입니다. 내용은 있는데 꺼내는 순서가 듣는 사람의 순서와 어긋나 있을 수 있습니다. 청중 · 목표와 함께 이 영역이 비어 있으면 화술을 다듬어도 결과가 잘 달라지지 않습니다.","mid":"뼈대는 있지만 장과 장 사이, 결론 바로 뒤에서 흐름이 끊길 수 있습니다. 문장 네 개를 먼저 정하면 뼈대가 섭니다.","strong":"슬라이드마다 메시지가 있고, 장과 장 사이가 이어지는 구성입니다. 듣는 사람이 다음을 궁금해하는 순서로 말하고 있습니다."},"rx":"슬라이드마다 한 문장, 장 사이에 한 문장, 시작할 때 한 문장, 결론 뒤에 한 문장. 그 네 문장이면 15분 발표의 뼈대가 섭니다.","practice":"결론은 ______입니다. / 다만 여기에는 조건이 ______개 있습니다. / 이 조건을 알고 계셔야 정확한 판단을 하실 수 있을 겁니다. / 설명드려도 되겠습니까?. 채우실 곳은 앞의 두 줄뿐입니다. 둘째 줄의 숫자 하나가 이 실습의 전부입니다.","practiceShort":"결론 뒤에 조건이 몇 개인지 숫자로 말한다","rec":{"text":"08 1S1M + 연결어 · 09-1 기본 구성 · 12 마무리 요소","lecture":"10장 「연결어가 없으면 청중은 길을 잃습니다」 · 11장 「로켓 모델」 · 12장 「결론부터 말했는데 왜 더 헷갈릴까요」","book":"『다 말하지 마세요』 10 · 11 · 12장 [기업 회차 끔]"},"items":[{"code":"ST01","short":"한 장 한 메시지","text":"나는 슬라이드마다 핵심 메시지를 한 문장으로 말할 수 있다","rev":false,"on":true,"low":"한 ,"low":"손이 어디에 있어야 할지 몰라 자세가 자주 바뀌고 있을 수 있습니다. 좋은 발표의 자세는 거의 정해져 있습니다.","spare":false},{"code":"BO02","short":"청중을 향한 시선","text":"나는 청중을 향해 자연스럽게 시선을 유지하며 말한다","rev":false,"on":true,"low":"시선이 스크린이나 자료에 오래 머물고 있을 수 있습니다. 시선이 화면에 있으면 설득의 주체가 슬라이드로 넘어갑니다.","spare":false},{"code":"BO03","short":"막히면 시선 아래","text":"나는 말이 막히면 시선을 살짝 아래로 두고 잠깐 멈춘다","rev":false,"on":true,"low":"말이 막히면 눈동자가 위로 올라가고 있을 수 있습니다. 위로 올리면 당황한 것으로, 살짝 아래로 내리면 생각하는 것으로 보입니다.","spare":false},{"code":"BO04","short":"적게, 크게, 명확하게","text":"나는 제스처를 적게 쓰되, 쓸 때는 크고 명확하게 한다","rev":false,"on":true,"low":"손이 말마다 따라 움직이거나, 쓸 때도 작게 끝나고 있을 수 있습니다. 자주 쓰는 제스처는 강조로 읽히지 않습니다.","spare":false},{"code":"BO05","short":"녹화로 점검","text":"나는 내 발표를 녹화해 자세 · 표정 · 시선을 점검해 본 적이 있다","rev":false,"on":true,"low":"내 발표를 화면으로 본 적이 없을 수 있습니다. 녹화한 뒤 청중의 입장이 되어 보면 개선점이 훨씬 빠르고 명확하게 보입니다.","spare":false},{"code":"BO06","short":"닫힌 자세","text":"나는 발표 중에 팔짱 · 주머니에 손 · 뒷짐 같은 자세가 나온다","rev":true,"on":false,"low":"긴장하면 팔짱이나 주머니 같은 닫힌 자세가 나오고 있을 수 있습니다. 말투는 개성이어도 몸은 표준이 있습니다.","spare":true},{"code":"BO07","short":"몸은 청중 쪽","text":"나는 몸을 청중 쪽으로 두고 고개만 돌려 스크린을 본다","rev":false,"on":false,"low":"스크린을 볼 때 몸까지 함께 돌아가고 있을 수 있습니다. 몸이 청중을 향해 있어야 말도 청중에게 갑니다.","spare":true},{"code":"BO08","short":"한 문장에 한 사람","text":"나는 여러 명 앞에서 한 문장에 한 사람을 보고, 다음 문장에서 다른 사람으로 옮긴다","rev":false,"on":false,"low":"시선이 청중 전체를 훑고 지나가고 있을 수 있습니다. 훑으면 아무도 안 본 것이 됩니다.","spare":true},{"code":"BO09","short":"표정 확인","text":"나는 내가 의도한 표정이 그대로 읽히는지 거울 · 녹화 · 동료로 확인해 본 적이 있다","rev":false,"on":false,"low":"내가 지은 표정과 남에게 보이는 표정이 다를 수 있습니다. 한 번 확인해 보면 차이가 바로 보입니다.","spare":true},{"code":"BO10","short":"웹캠 렌즈","text":"나는 온라인 발표에서 카메라를 눈높이에 두고 웹캠 렌즈를 보며 말한다","rev":false,"on":false,"low":"화면 속 상대의 얼굴을 보며 말하고 있을 수 있습니다. 상대에게는 웹캠 렌즈를 보는 것이 눈을 보는 것입니다.","spare":true}]},{"code":"RH","order":8,"name":"실전 리허설","layer":"화술","head":"단시간에 효과적으로 리허설 하기","line":"시간이 바뀌어도 버릴 순서와 첫 30초가 준비되어 있다","verdict":{"weak":"아직 손이 덜 간 영역입니다. 처음부터 끝까지 한 덩어리로 준비해, 시간이 줄거나 질문이 들어오면 흔들릴 수 있습니다. 열심히 외우는 것은 절반의 성공이고, 나머지 절반은 유연성입니다.","mid":"리허설은 하지만 시간이 줄었을 때 무엇을 뺄지는 정하지 않았을 수 있습니다. 버릴 순서를 미리 적어 두시면 됩니다.","strong":"길이를 바꿔 말할 수 있고, 무대 직전의 준비 순서가 있습니다. 급한 상황에서도 짧게 말할 수 있는 준비입니다."},"rx":"10분이 주어졌으면 7분에 끝내십시오. 그러니 속도를 올리지 말고 항목을 빼십시오. 먼저 버릴 것이 넷입니다. 중심 사례에 덧붙인 사례, 배경 설명, 방법론의 이름과 과정, 두 번째와 세 번째 근거입니다. 끝까지 남길 것도 넷입니다. 키워드 예고, 결론과 숫자, 리캡, 상대가 할 일 하나입니다.","practice":"그 30초에 할 말을 미리 정해 통째로 외워 두십시오. 나머지는 외우지 않아도 됩니다. 30초에 넣을 것은 세 가지입니다. 오늘 무엇을 말할지 한 문장, 몇 분 걸릴지, 듣는 사람이 얻어 갈 것 하나.","practiceShort":"첫 30초에 할 말을 정해 통째로 외운다","rec":{"text":"01 시간 감각 · 20 참여 유도 · 21 리허설","lecture":"3장 「무대 울렁증은 특별한 병이 아닙니다」 · 16장 「시간이 갑자기 줄었을 때」 · 14장 「포스트잇 한 장이면 됩니다」","book":"『다 말하지 마세요』 3 · 16장(+14장) [기업 회차 끔]"},"items":[{"code":"RH01","short":"세 길이","text":"나는 같은 내용을 5분 · 30분 · 1시간으로 조절해 발표할 수 있다","rev":false,"on":true,"low":"준비한 길이 하나로만 말할 수 있는 상태일 수 있습니다. 직급이 올라갈수록 발표 시간은 예고 없이 바뀝니다.","spare":false},{"code":"RH02","short":"항목부터 빼기","text":"나는 시간이 줄면 속도를 올리지 않고 미리 정한 항목부터 뺀다","rev":false,"on":true,"low":"시간이 줄면 앞부분을 빨리 넘기고 있을 수 있습니다. 빨리 넘긴다고 시간이 줄지 않습니다. 말이 빨라지면 문장이 늘어납니다.","spare":false},{"code":"RH03","short":"첫 30초","text":"나는 첫 30초에 할 말을 정해 통째로 외워 둔다","rev":false,"on":true,"low":"첫마디를 현장에서 떠올리고 있을 수 있습니다. 15분 발표라면 900초 가운데 30초만 외워 두면 됩니다.","spare":false},{"code":"RH04","short":"5분 리허설","text":"나는 발표 직전에 5분 리허설과 심호흡 다섯 번을 한다","rev":false,"on":true,"low":"발표 직전의 시간을 자료를 넘겨 보는 데 쓰고 있을 수 있습니다. 직전 5분에 소리 내어 한 번 말해 보면 첫 문장이 입에 붙습니다.","spare":false},{"code":"RH05","short":"예상 질문","text":"나는 예상 질문 리스트를 만들고 답을 준비한다","rev":false,"on":true,"low":"질문은 현장에서 받아 처리하면 된다고 여기고 있을 수 있습니다. 가장 곤란한 질문에 답할 문장이 없으면 발표 전체의 인상이 흔들립니다.","spare":false},{"code":"RH06","short":"시간 예측","text":"나는 말을 마친 뒤 시계를 보기 전에 걸린 시간을 먼저 예측해 본다","rev":false,"on":false,"low":"지금 몇 분을 말했는지 감각 없이 발표하고 있을 수 있습니다. 예측과 실제의 차이를 몇 번만 겪어도 오차가 빠르게 줄어듭니다.","spare":true},{"code":"RH07","short":"포스트잇 한 장","text":"나는 대본 대신 키워드 다섯 개 이하를 적은 포스트잇 한 장을 들고 발표한다","rev":false,"on":false,"low":"대본이나 빽빽한 메모를 들고 읽게 될 수 있습니다. 발표 내용을 한 장에 적을 수 없다면 아직 정리가 덜 된 것입니다.","spare"     $('in-name').required = nm === '필수'; $('in-org').required = om === '필수';
    var sv = loadSaved(), n = sv ? Object.keys(sv.ans || {}).length + (sv.choice ? 1 : 0) + Object.keys(sv.ladder || {}).length : 0;
    $('st-resume').hidden = !n;
    $('bt-restart').hidden = !n;
    if (n) {
      $('st-resume').textContent = T('이어 하기', { n: n });
      $('bt-start').textContent = T('단추-이어');
      $('bt-restart').textContent = T('단추-처음');
      $('in-name').value = sv.name || ''; $('in-org').value = sv.org || '';
    } else $('bt-start').innerHTML = esc(T('단추-시작')) + ' <span class="arrow">→</span>';
    $('st-tool').textContent = T('도구 표기');
    $('bt-back-t').textContent = T('단추-뒤로'); $('bt-back2-t').textContent = T('단추-뒤로');
    show('s-start');
  }
  function begin(resume) {
    var nm = $('in-name'), og = $('in-org');
    if (nm.required && !nm.value.trim()) { nm.focus(); return; }
    if (og.required && !og.value.trim()) { og.focus(); return; }
    S.name = nm.value.trim(); S.org = og.value.trim();
    var sv = resume ? loadSaved() : null;
    if (sv) { S.ans = sv.ans || {}; S.choice = sv.choice || null; S.ladder = sv.ladder || {}; S.open = sv.open || {}; S.t0 = sv.t0 || Date.now(); S.i = 0; while (S.i < S.steps.length - 1 && answered(S.steps[S.i])) S.i++; }
    else { S.ans = {}; S.choice = null; S.ladder = {}; S.open = {}; S.t0 = Date.now(); S.i = 0; clearSaved(); }
    step();
  }

  /* ── 문항 화면 ──────────────────────────────────── */
  var lock = false;
  function step() {
    var st = S.steps[S.i];
    if (!st) return finish();
    if (st.k === 'open') return openScreen();
    var t = S.tpl, opts = $('q-opts'), body = $('q-body'), n = S.i + 1;
    body.classList.remove('a-fade'); void body.offsetWidth; body.classList.add('a-fade');
    $('q-bar').style.width = Math.round(S.i / total() * 100) + '%';
    $('q-where').textContent = T('진행률', { '현재': n, '전체': total() });
    var tag = '', sub = '', html = '';
    if (st.k === 'choice') {
      tag = '<b>' + esc(t.choice.code) + '</b>' + esc(t.choice.title);
      $('q-text').textContent = t.choice.q; sub = t.choice.guide;
      html = '<div class="a-opts" role="group">' + t.choice.options.map(function (o, i) {
        return '<button type="button" class="a-opt" data-v="' + (i + 1) + '" aria-pressed="' + (S.choice === i + 1) + '"><span class="a-num num">' + (i + 1) + '</span><span>' + esc(o.label) + '</span></button>';
      }).join('') + '</div>';
    } else if (st.k === 'ladder') {
      tag = '<b>' + esc(st.code) + '</b>' + esc(T('사다리 머리'));
      $('q-text').textContent = st.text; sub = t.ladder.guide;
      var cur = S.ladder[st.code];
      html = '<div class="a-yn" role="group"><button type="button" class="a-opt" data-v="1" aria-pressed="' + (cur === true) + '">' + esc(t.ladder.yes) + '</button>' +
        '<button type="button" class="a-opt" data-v="0" aria-pressed="' + (cur === false) + '">' + esc(t.ladder.no) + '</button></div>';
    } else {
      var di = 0, d = null;
      t.domains.forEach(function (x, i) { if (x.code === st.domain) { d = x; di = i + 1; } });
      tag = '<b>' + esc(st.code) + '</b>' + esc(T('영역 전환', { '번호': di, '이름': d.name, '헤드 질문': d.head }));
      $('q-text').textContent = st.text;
      var first = S.steps.filter(function (x) { return x.k === 'item'; })[0];
      sub = first && first.code === st.code ? t.scale.guide : '';
      html = '<div class="a-opts" role="group">' + t.scale.points.map(function (p) {
        return '<button type="button" class="a-opt" data-v="' + p.v + '" aria-pressed="' + (Number(S.ans[st.code]) === Number(p.v)) + '"><span class="a-num num">' + p.v + '</span><span>' + esc(p.label) + '</span></button>';
      }).join('') + '</div>';
    }
    $('q-tag').innerHTML = tag;
    $('q-sub').textContent = sub; $('q-sub').hidden = !sub;
    opts.innerHTML = html;
    $('q-hint').innerHTML = '<span class="a-kbd">' + esc(T('키보드 안내')) + '<br></span>' + esc(T('중간 저장'));
    show('s-q');
    lock = false;
  }
  function pickOpt(v) {
    if (lock) return;
    var st = S.steps[S.i]; if (!st) return;
    if (st.k === 'choice') S.choice = Number(v);
    else if (st.k === 'ladder') S.ladder[st.code] = String(v) === '1';
    else S.ans[st.code] = Number(v);
    Array.prototype.forEach.call($('q-opts').querySelectorAll('.a-opt'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === String(v))); });
    lock = true;
    S.i++; save();
    setTimeout(step, 170);
  }
  function back() {
    if (S.i <= 0) return startScreen();
    S.i--; save(); step();
  }
  function openScreen() {
    var t = S.tpl, h = '';
    $('o-where').textContent = T('진행률', { '현재': total(), '전체': total() });
    (t.open || []).forEach(function (o) {
      h += '<span class="eyebrow"><span class="mark"></span>' + esc(o.code) + '</span><h2>' + esc(o.q) + '</h2><p class="a-qsub">' + esc(o.guide) + '</p>' +
        '<textarea class="a-area" data-open="' + esc(o.code) + '" maxlength="1000" placeholder="' + esc(o.placeholder) + '"' + (o.required ? ' required' : '') + '>' + esc(S.open[o.code] || '') + '</textarea>';
    });
    var req = (t.open || []).some(function (o) { return o.required; });
    h += '<div class="a-row">' + (req ? '' : '<button type="button" class="btn btn-line" id="bt-skip">' + esc(T('주관식 단추-건너뛰기')) + '</button>') +
      '<button type="button" class="btn btn-primary" id="bt-result">' + esc(T('단추-결과')) + ' <span class="arrow">→</span></button></div>';
    $('o-body').innerHTML = h;
    show('s-open');
    if ($('bt-skip')) $('bt-skip').onclick = function () { S.open = {}; finish(); };
    $('bt-result').onclick = function () {
      var miss = null;
      Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (ta) { S.open[ta.getAttribute('data-open')] = ta.value.trim(); if (ta.required && !ta.value.trim() && !miss) miss = ta; });
      if (miss) { miss.focus(); return; }
      finish();
    };
  }

  /* ── 결과 ───────────────────────────────────────── */
  function finish() {
    var res = E.score(S.tpl, respObj());
    if (!res.complete) {
      var m = res.missing[0];
      for (var i = 0; i < S.steps.length; i++) if (S.steps[i].code === m) { S.i = i; return step(); }
    }
    S.res = res;
    var sec = Math.round((Date.now() - (S.t0 || Date.now())) / 1000);
    clearSaved();
    S.status = '';
    report();
    if (S.mode === 'cohort' || S.netFail) submit(sec);
  }
  function ctx() {
    var c = S.cohort || {}, trial = S.mode !== 'cohort' && S.mode !== 'result';
    return { tpl: S.tpl, res: S.res, resp: respObj(), course: course(), date: S.date || today(), name: S.name, org: S.org,
             trial: trial, book: S.cohort ? !!c.book : true, kakao: S.cohort ? !!c.kakao : true, kakaoUrl: CFG.kakao, pick: S.pick, mode: 'participant',
             offline: S.mode !== 'cohort' && S.mode !== 'result', fileLabel: '결과 파일 저장', status: S.status, cardUrl: S.cardUrl,
             on: { pick: onPick, card: saveCard, copy: copyUrl, file: saveFile } };
  }
  function report() {
    window.ClassReport.render($('report-root'), ctx());
    show('s-report');
    drawCard();
  }
  function setStatus(t) { S.status = t; var el = $('rp-status'); if (el) el.textContent = t; }
  function onPick(code) {
    S.pick = S.pick === code ? null : code;
    var y = window.scrollY;
    window.ClassReport.render($('report-root'), ctx());
    window.scrollTo(0, y);
    if (S.pick) toast(T('고름 확인'));
    drawCard();
    if (S.mode === 'result' || (S.mode === 'cohort' && S.rkey)) apiPost({ a: 'pick', c: S.code, r: S.rkey, pick: S.pick || '' }).catch(function () { });
  }
  function slots() { return E.cardSlots(S.tpl, S.res, { course: course(), pick: S.pick, trial: !S.cohort, date: S.date || today() }); }
  var drawing = null;
  function drawCard() {
    var cv = $('card-canvas');
    drawing = window.ClassCard.draw(cv, slots(), { logo: LOGO_URI,
      weak: Number(S.tpl.verdict.weak), strong: Number(S.tpl.verdict.strong) }).then(function () {
      S.cardUrl = cv.toDataURL('image/png');
      window.__cardDataUrl = S.cardUrl;
      var img = $('rp-preview-img'), fig = $('rp-preview');
      if (img) { img.src = S.cardUrl; fig.hidden = false; }
      return cv;
    });
    return drawing;
  }
  function fileName(ext) { return (course() + '_' + (S.date || today()).replace(/\./g, '')).replace(/[\\/:*?"<>|\s]+/g, '_') + '.' + ext; }
  function download(blob, name) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function saveCard() {
    (drawing || drawCard()).then(function (cv) { return window.ClassCard.toBlob(cv); }).then(function (blob) {
      if (!blob) return;
      var file = null;
      try { file = new File([blob], fileName('png'), { type: 'image/png' }); } catch (e) { }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: course() }).catch(function () { });
      } else { toast(T('카드 공유 불가')); download(blob, fileName('png')); }
    });
  }
  function resultUrl() {
    var base = location.href.split('#')[0].split('?')[0];
    if (S.rkey && S.code) return base + '?co=' + encodeURIComponent(S.code) + '&rk=' + encodeURIComponent(S.rkey);
    return base + '#s=' + E.pack(S.tpl, respObj());
  }
  function copyUrl() {
    var u = resultUrl();
    function done() { toast(T('주소 복사됨')); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, fallback); else fallback();
    function fallback() { var ta = document.createElement('textarea'); ta.value = u; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove(); done(); }
    window.__lastUrl = u;
  }
  function saveFile() {
    var data = { ref: E.ref(S.tpl), course: course(), date: S.date || today(), name: S.name, org: S.org, resp: respObj(), pick: S.pick,
                 domains: S.res.domains.map(function (d) { return { code: d.code, score: d.score }; }), stage: S.res.stage, focus: S.res.focus, url: resultUrl() };
    download(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), fileName('json'));
    toast(T('결과 파일 저장'));
  }
  /* 자동 재시도 — 서버 오류(잠금 시간초과 포함) · 연결 오류면 2초 · 5초 · 10초 뒤 최대 3번. 처음 만든 제출 번호(sid) · 글 ID(eid)를
     그대로 보내므로 서버는 같은 것을 두 번 붙이지 않는다. 그래도 안 되면 '연결되면 자동으로 보냅니다' 경로로 넘긴다 */
  var RETRY_MS = [2000, 5000, 10000];
  function retrying(send, body) {
    var n = 0;
    function go() {
      body.retry = n;
      return send(body).then(function (r) {
        if (r && r.ok === false && r.error === 'server' && n < RETRY_MS.length) return later();
        return r;
      }, function (e) { if (n < RETRY_MS.length) return later(); throw e; });
    }
    function later() { var d = RETRY_MS[n++]; return new Promise(function (res) { setTimeout(res, d); }).then(go); }
    return go();
  }
  function newId(n) { var s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.substring(0, n); }
  function pendingKey() { return 'classdiag:pending:' + S.code; }
  function submit(sec) {
    S.sid = S.sid || newId(16);                               // 제출 번호 — 다시 보내도 같은 번호(서버가 중복 행을 만들지 않는다)
    var body = { a: 'submit', c: S.code, sid: S.sid, tid: S.tpl.id, ver: S.tpl.version, name: S.name, org: S.org, sec: sec, ans: S.ans, choice: S.choice, ladder: S.ladder, open: S.open, pick: S.pick };
    setStatus(T('제출 중'));
    send(body);
  }
  function send(body) {
    retrying(apiPost, body).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.error) || 'server');
      S.rkey = r.rkey;
      ls(function () { localStorage.removeItem(pendingKey()); });
      setStatus(T('저장 완료'));
      try { history.replaceState(null, '', location.pathname + '?co=' + encodeURIComponent(S.code) + '&rk=' + encodeURIComponent(r.rkey)); } catch (e) { }
      S.mode = 'result';
    }).catch(function (e) {
      if (String(e && e.message) === 'closed') { setStatus(T('마감', { '마감일': (S.cohort && S.cohort.due) || '' })); return; }
      ls(function () { localStorage.setItem(pendingKey(), JSON.stringify(body)); });
      setStatus(T('저장 실패'));
    });
  }
  function retryPending() {
    var body = ls(function () { return JSON.parse(localStorage.getItem(pendingKey()) || 'null'); }, null);
    if (body && CFG.url) { body.retry = 1; send(body); }
  }

  /* ── 안내 화면 ──────────────────────────────────── */
  function msg(text, trialBtn) {
    $('m-text').textContent = text;
    $('m-actions').innerHTML = trialBtn ? '<button type="button" class="btn btn-primary" id="bt-trial">' + esc(T('단추-시작')) + '</button>' : '';
    if (trialBtn) $('bt-trial').onclick = function () { S.mode = 'trial'; S.cohort = null; S.code = ''; buildSteps(); startScreen(); };
    show('s-msg');
  }

  /* ── 시작 ───────────────────────────────────────── */
  function boot() {
    var q = new URLSearchParams(location.search);
    S.code = (q.get('co') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 8);
    var rk = (q.get('rk') || '').replace(/[^0-9a-zA-Z]/g, '').substring(0, 40);
    var hs = location.hash.match(/[#&]s=([^&]+)/);
    document.addEventListener('click', function (e) {
      var o = e.target.closest && e.target.closest('#q-opts .a-opt');
      if (o) pickOpt(o.getAttribute('data-v'));
    });
    $('bt-back').onclick = back; $('bt-back2').onclick = back;
    $('bt-start').onclick = function () { begin(!$('st-resume').hidden); };
    $('bt-restart').onclick = function () { clearSaved(); begin(false); };
    document.addEventListener('keydown', function (e) {
      if (!$('s-q').classList.contains('a-on') || e.altKey || e.ctrlKey || e.metaKey) return;
      var st = S.steps[S.i]; if (!st) return;
      if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); return; }
      var n = Number(e.key);
      if (!isFinite(n) || n < 1) return;
      if (st.k === 'ladder') { if (n === 1) pickOpt('1'); else if (n === 2) pickOpt('0'); }
      else if (st.k === 'choice') { if (n <= S.tpl.choice.options.length) pickOpt(String(n)); }
      else if (S.tpl.scale.points.some(function (p) { return Number(p.v) === n; })) pickOpt(String(n));
    });
    window.addEventListener('online', retryPending);
    if (hs) {                                                  // 오프라인 결과 주소 — 내장 템플릿으로 되살린다
      var resp = E.unpack(S.tpl, decodeURIComponent(hs[1]));
      if (!resp) return msg(T('결과 없음'));
      S.ans = resp.ans; S.choice = resp.choice; S.ladder = resp.ladder; S.res = E.score(S.tpl, resp);
      S.mode = 'restored';
      return report();
    }
    if (!S.code) { S.mode = 'trial'; buildSteps(); return startScreen(); }
    if (!CFG.url) { S.mode = 'offline'; buildSteps(); return startScreen(); }
    if (rk) {
      return apiGet({ a: 'result', c: S.code, r: rk }).then(function (r) {
        if (!r || !r.ok) return msg(T('결과 없음'));
        S.tpl = r.tpl; S.cohort = r.cohort; S.rkey = rk; S.mode = 'result';
        S.ans = r.resp.ans || {}; S.choice = r.resp.choice; S.ladder = r.resp.ladder || {}; S.name = r.name || ''; S.org = r.org || ''; S.pick = r.pick || null;
        S.date = r.date || ''; S.res = E.score(S.tpl, r.resp);
        S.status = T('저장 완료');
        report();
      }).catch(function () { msg(T('연결 끊김')); });
    }
    apiGet({ a: 'cohort', c: S.code }).then(function (r) {
      if (!r || !r.ok) return r && r.error === 'closed' ? msg(T('마감', { '마감일': r.due || '' }), true) : msg(T('회차 없음'));
      S.cohort = r.cohort; S.tpl = r.tpl; S.mode = 'cohort';
      buildSteps(); startScreen(); retryPending();
    }).catch(function () {
      S.mode = 'offline'; S.netFail = true; S.note = T('연결 끊김'); buildSteps(); startScreen();
    });
  }
  window.__app = { S: S, E: E, drawCard: drawCard, resultUrl: resultUrl, go: function (i) { S.i = i; step(); }, pick: pickOpt, finish: finish };   // 검수(capture.js)용 손잡이
  boot();
}());
</script>
</body>
</html>
